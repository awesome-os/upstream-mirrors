name: Holo 5-OS Tier-5 Shards — Pure Zig 0.14.0 & CMake Cross-Compiled Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-tier5-shards.yml'
      - '.github/workflows/holo-5os-tier5-shards.mts'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Ensure GitHub Release & Resolve Tier-5 Upstream Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: node .github/workflows/holo-5os-tier5-shards.mts resolve

      - uses: actions/upload-artifact@v7
        with:
          name: resolved-tier5-versions
          path: resolved-tier5-versions.json

  build-tier5-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - vulkan-headers
          - spirv-headers
          - cccl
          - cutlass
          - dav1d
          - librdkafka
          - libsdl3
          - re2
          - spirv-tools
          - glslang
          - ffmpeg
          - meson
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier5-shards.yml', '.github/workflows/holo-5os-tier5-shards.mts') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Compile ${{ matrix.lib }} for Multi-OS Targets via Zig 0.14.0 + Smoke Test
        id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/holo-5os-tier5-shards.mts build

      - uses: actions/upload-artifact@v7
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with:
          name: tier5-sums-${{ matrix.lib }}
          path: dist/SHA512SUMS-${{ matrix.lib }}.txt

      - name: Upload Tier-5 5-OS Shard Binaries & Receipt to GitHub Release
        if: ${{ steps.build.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

      - name: Attest SLSA Build Provenance for ${{ matrix.lib }} Shard & Receipt
        if: ${{ steps.build.outputs.skipped != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

  finalize-tier5-sums:
    needs: [ensure-release, build-tier5-5os-shard]
    if: ${{ !cancelled() && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Summarize Tier-5 Shards & Upload Tier-5 SHA512SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: node .github/workflows/holo-5os-tier5-shards.mts finalize

      - name: Attest SLSA Build Provenance for Tier-5 Checksums
        if: ${{ hashFiles('/tmp/SHA512SUMS-tier5.txt') != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '/tmp/SHA512SUMS-tier5.txt'
