          EOF
            zig cc -target x86_64-linux-gnu -O2 /tmp/dlprobe.c -ldl -o /tmp/dlprobe
            LD_LIBRARY_PATH="${DL_LD_LIBRARY_PATH}" /tmp/dlprobe "dist/${LIB_OUT}-linux-x64.so"
          fi

          if [ -f "dist/${LIB_OUT}-wasm32-wasi.wasm" ]; then
            node -e '
              const fs = require("node:fs");
              const p = process.argv[1];
              const buf = fs.readFileSync(p);
              if (buf.length < 8 || buf[0] !== 0x00 || buf[1] !== 0x61 || buf[2] !== 0x73 || buf[3] !== 0x6d) {
                console.error("Invalid WASM magic header in", p);
                process.exit(1);
              }
              if (!WebAssembly.validate(buf)) {
                console.error("WebAssembly.validate failed in", p);
                process.exit(1);
              }
              console.log("WebAssembly.validate OK:", p, buf.length, "bytes");
            ' "dist/${LIB_OUT}-wasm32-wasi.wasm"
          fi

          (cd dist && sha512sum * > "SHA512SUMS-${LIB_KEY}.txt")
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const distDir = "dist";
            const files = fs.readdirSync(distDir)
              .filter(f => /\.(dll|so|dylib|wasm|dll\.a|exe|pyz)$/.test(f) || /-(linux-x64|linux-arm64|macos-arm64)$/.test(f))
              .sort();
            const artifacts = files.map(name => {
              const buf = fs.readFileSync(path.join(distDir, name));
              return {
                name,
                size: buf.length,
                sha512: crypto.createHash("sha512").update(buf).digest("hex")
              };
            });
            const receipt = {
              schema: "holo-v11.shard-receipt.v1",
              pkg: process.env.LIB_KEY,
              libOut: process.env.LIB_OUT,
              repo: process.env.UP_REPO,
              tag: process.env.UP_TAG,
              version: process.env.UP_VER,
              deterministic: true,
              artifacts
            };
            fs.writeFileSync(
              path.join(distDir, `${process.env.LIB_OUT}-receipt.json`),
              JSON.stringify(receipt, null, 2) + "\n"
            );
          '
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with:
          name: tier5-sums-${{ matrix.lib }}
          path: dist/SHA512SUMS-${{ matrix.lib }}.txt

      - name: Upload Tier-5 5-OS Shard Binaries & Receipt to GitHub Release
        if: ${{ steps.build.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

      - name: Attest SLSA Build Provenance for ${{ matrix.lib }} Shard & Receipt
        if: ${{ steps.build.outputs.skipped != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

  finalize-tier5-sums:
    needs: [ensure-release, build-tier5-5os-shard]
    if: ${{ !cancelled() && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Summarize Tier-5 Shards & Upload Tier-5 SHA512SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = "/tmp/artifacts";
            const resolvedPath = path.join(root, "resolved-tier5-versions", "resolved-tier5-versions.json");
            const resolved = fs.existsSync(resolvedPath) ? JSON.parse(fs.readFileSync(resolvedPath, "utf8")).libraries : {};
            const expected = Object.keys(resolved);

            const sumLines = [];
            const rows = [];
            let passedCount = 0;

            for (const lib of expected) {
              const sumFile = path.join(root, `tier5-sums-${lib}`, `SHA512SUMS-${lib}.txt`);
              if (!fs.existsSync(sumFile)) {
                rows.push(`| \`${lib}\` | ${resolved[lib].tag} | FAILED | - |`);
                continue;
              }
              const lines = fs.readFileSync(sumFile, "utf8").trim().split(/\r?\n/).filter(Boolean);
              const targets = [];
              for (const line of lines) {
                const [sha, name] = line.trim().split(/\s+/);
                if (!sha || !name || name.endsWith(".txt") || name.endsWith(".json")) continue;
                sumLines.push(`${sha}  ${name}`);
                if (name.endsWith("-win64.dll") || name.endsWith("-win64.exe")) targets.push("win64");
                else if (name.endsWith("-linux-x64.so") || name.endsWith("-linux-x64")) targets.push("linux-x64");
                else if (name.endsWith("-linux-arm64.so") || name.endsWith("-linux-arm64")) targets.push("linux-arm64");
                else if (name.endsWith("-macos-arm64.dylib") || name.endsWith("-macos-arm64")) targets.push("macos-arm64");
                else if (name.endsWith("-wasm32-wasi.wasm")) targets.push("wasm32-wasi");
                else if (name.endsWith(".pyz")) targets.push("pyz");
              }
              passedCount++;
              rows.push(`| \`${lib}\` | ${resolved[lib].tag} | PASS | ${targets.join(", ")} |`);
            }

            fs.writeFileSync("/tmp/SHA512SUMS-tier5.txt", sumLines.join("\n") + "\n");
            const summary = [
              `## Holo 5-OS Tier-5 Shards (${process.env.TAG})`,
              "",
              `- **Passed:** ${passedCount}/${expected.length}`,
              "",
              "| Library | Tag | Status | Targets |",
              "| :--- | :--- | :--- | :--- |",
              ...rows,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          '
          if [ -s /tmp/SHA512SUMS-tier5.txt ]; then
            gh release upload "$TAG" /tmp/SHA512SUMS-tier5.txt --repo awesome-os/upstream-mirrors --clobber
          fi

      - name: Attest SLSA Build Provenance for Tier-5 Checksums
        if: ${{ hashFiles('/tmp/SHA512SUMS-tier5.txt') != '' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '/tmp/SHA512SUMS-tier5.txt'
