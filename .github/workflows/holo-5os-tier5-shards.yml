name: Holo 5-OS Tier-5 Shards — Pure Zig 0.14.0 & CMake Cross-Compiled Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-tier5-shards.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure GitHub Release & Resolve Tier-5 Upstream Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: |
          gh release view "$TAG" --repo awesome-os/upstream-mirrors >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/upstream-mirrors \
              --title "Holo v11 Max 5-OS Shared + WASI Libraries (${TAG})" \
              --notes "Production max-version 5-OS shared libraries (Win64 .dll, Linux x64/ARM64 .so, macOS ARM64 .dylib, wasm32-wasi .wasm) compiled directly from upstream sources via holo-compiler (zig 0.14.0)."

          node -e '
            const fs = require("node:fs");
            const defaults = {
              "vulkan-headers": { pkg: "vulkan-headers", libOut: "libvulkan_headers", repo: "KhronosGroup/Vulkan-Headers",  tag: "v1.4.369",               version: "1.4.369" },
              "spirv-headers":  { pkg: "spirv-headers",  libOut: "libspirv_headers",  repo: "KhronosGroup/SPIRV-Headers",   tag: "vulkan-sdk-1.4.363.0",   version: "1.4.363.0" },
              cccl:             { pkg: "cccl",           libOut: "libcccl",           repo: "NVIDIA/cccl",                  tag: "v3.5.0",                 version: "3.5.0" },
              cutlass:          { pkg: "cutlass",        libOut: "libcutlass",        repo: "NVIDIA/cutlass",               tag: "v4.9.0dev",              version: "4.9.0" },
              dav1d:            { pkg: "dav1d",          libOut: "libdav1d",          repo: "videolan/dav1d",               tag: "1.5.5",                  version: "1.5.5" },
              librdkafka:       { pkg: "librdkafka",     libOut: "librdkafka",        repo: "confluentinc/librdkafka",      tag: "v2.16.0",                version: "2.16.0" },
              libsdl3:          { pkg: "libsdl3",        libOut: "libSDL3",           repo: "libsdl-org/SDL",               tag: "release-3.4.20",         version: "3.4.20" },
              re2:              { pkg: "re2",            libOut: "libre2",            repo: "google/re2",                   tag: "2025-11-05",             version: "2025-11-05" },
              "spirv-tools":    { pkg: "spirv-tools",    libOut: "libSPIRV-Tools",    repo: "KhronosGroup/SPIRV-Tools",     tag: "v2026.4",                version: "2026.4" },
              glslang:          { pkg: "glslang",        libOut: "libglslang",        repo: "KhronosGroup/glslang",         tag: "16.6.0",                 version: "16.6.0" },
              ffmpeg:           { pkg: "ffmpeg",         libOut: "libavutil",         repo: "FFmpeg/FFmpeg",                tag: "n9.1",                   version: "9.1" },
              meson:            { pkg: "meson",          libOut: "meson",             repo: "mesonbuild/meson",             tag: "1.12.1",                 version: "1.12.1" }
            };

            (async () => {
              const resolved = structuredClone(defaults);
              try {
                const res = await fetch("https://raw.githubusercontent.com/awesome-os/t2linux-baseline/main/catalog/live-upstream-tracker.json");
                if (res.ok) {
                  const tracker = await res.json();
                  const byPkg = new Map((tracker.libraries || []).map(x => [x.pkg, x]));
                  for (const cfg of Object.values(resolved)) {
                    const hit = byPkg.get(cfg.pkg);
                    if (hit && hit.upstreamTag) {
                      cfg.tag = hit.upstreamTag;
                      cfg.version = hit.upstreamVersion || hit.upstreamTag.replace(/^v/, "");
                      if (hit.repo && hit.repo.includes("/") && !hit.repo.includes("sourceforge.net")) {
                        cfg.repo = hit.repo;
                      }
                    }
                  }
                }
              } catch (err) {
                console.warn("[warn] tracker fetch failed, using safe defaults:", err.message);
              }

              const payload = {
                schema: "holo-v11.resolved-versions.v1",
                tier: "tier5",
                resolvedAt: new Date().toISOString(),
                releaseTag: process.env.TAG,
                libraries: resolved
              };
              fs.writeFileSync("resolved-tier5-versions.json", JSON.stringify(payload, null, 2) + "\n");
              const compact = JSON.stringify(resolved);
              const outFile = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(outFile, `release_tag=${process.env.TAG}\n`);
              fs.appendFileSync(outFile, `versions_json=${compact}\n`);
              console.log("Resolved 12 Tier-5 libraries:", JSON.stringify(resolved, null, 2));
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - uses: actions/upload-artifact@v7
        with:
          name: resolved-tier5-versions
          path: resolved-tier5-versions.json

  build-tier5-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - vulkan-headers
          - spirv-headers
          - cccl
          - cutlass
          - dav1d
          - librdkafka
          - libsdl3
          - re2
          - spirv-tools
          - glslang
          - ffmpeg
          - meson
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/holo-5os-tier5-shards.yml

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier5-shards.yml') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compile ${{ matrix.lib }} for Multi-OS Targets via Zig 0.14.0 + Smoke Test
        id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const v = JSON.parse(process.env.VERSIONS_JSON)[process.env.LIB_KEY];
            console.log(`export UP_REPO=${JSON.stringify(v.repo)}`);
            console.log(`export UP_TAG=${JSON.stringify(v.tag)}`);
            console.log(`export UP_VER=${JSON.stringify(v.version)}`);
            console.log(`export LIB_OUT=${JSON.stringify(v.libOut)}`);
          ')"
          echo "lib_out=${LIB_OUT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_REBUILD}" != "true" ]; then
            mkdir -p /tmp/skip-check
            gh release view "$RELEASE_TAG" --repo awesome-os/upstream-mirrors --json assets > /tmp/skip-check/assets.json 2>/dev/null || echo '{"assets":[]}' > /tmp/skip-check/assets.json
            RECEIPT_NAME="${LIB_OUT}-receipt.json"
            if node -e '
              const fs = require("node:fs");
              const assets = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).assets || [];
              process.exit(assets.some(a => a.name === process.argv[2]) ? 0 : 1);
            ' /tmp/skip-check/assets.json "$RECEIPT_NAME"; then
              if gh release download "$RELEASE_TAG" --repo awesome-os/upstream-mirrors -p "$RECEIPT_NAME" -D /tmp/skip-check --clobber >/dev/null 2>&1; then
                if node -e '
                  const fs = require("node:fs");
                  const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const assets = new Set((JSON.parse(fs.readFileSync(process.argv[2], "utf8")).assets || []).map(a => a.name));
                  const upVer = process.argv[3];
                  const ok = receipt &&
                    receipt.version === upVer &&
                    Array.isArray(receipt.artifacts) &&
                    receipt.artifacts.length > 0 &&
                    receipt.artifacts.every(a => a && typeof a.name === "string" && assets.has(a.name));
                  process.exit(ok ? 0 : 1);
                ' "/tmp/skip-check/${RECEIPT_NAME}" /tmp/skip-check/assets.json "$UP_VER"; then
                  echo "skipped=true" >> "$GITHUB_OUTPUT"
                  echo "SKIP: ${LIB_KEY} ${UP_VER} already materialized"
                  exit 0
                fi
              fi
            fi
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          echo "=== Building ${LIB_KEY} (${LIB_OUT}) @ ${UP_REPO} ${UP_TAG} (${UP_VER}) ==="

          mkdir -p src dist
          DET_FLAGS="-ffile-prefix-map=$PWD=."
          DET_LINUX_FLAGS="-ffile-prefix-map=$PWD=. -Wl,--build-id=none"
          DL_LD_LIBRARY_PATH=""

          clone_tag() {
            local repo_url="https://github.com/${UP_REPO}.git"
            if [[ "$UP_REPO" == gitlab.* ]]; then
              repo_url="https://${UP_REPO}.git"
            fi
            git clone --depth=1 --branch "$UP_TAG" "$repo_url" src
          }

          make_cmake_wrappers() {
            local wrap_dir="$1"
            local zig_target="$2"
            local extra_flags="$3"
            mkdir -p "$wrap_dir"
            cat > "${wrap_dir}/cc" <<EOF
          #!/usr/bin/env bash
          exec zig cc -target ${zig_target} ${extra_flags} "\$@"
          EOF
            cat > "${wrap_dir}/cxx" <<EOF
          #!/usr/bin/env bash
          exec zig c++ -target ${zig_target} ${extra_flags} "\$@"
          EOF
            cat > "${wrap_dir}/ar" <<'EOF'
          #!/usr/bin/env bash
          exec zig ar "$@"
          EOF
            cat > "${wrap_dir}/ranlib" <<'EOF'
          #!/usr/bin/env bash
          exec zig ranlib "$@"
          EOF
            cat > "${wrap_dir}/windres" <<'EOF'
          #!/usr/bin/env bash
          out=""
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "-o" ]; then out="$arg"; fi
            prev="$arg"
          done
          if [ -n "$out" ]; then
            exec zig cc -target x86_64-windows-gnu $DET_FLAGS -x c -c /dev/null -o "$out"
          fi
          EOF
            chmod +x "${wrap_dir}/cc" "${wrap_dir}/cxx" "${wrap_dir}/ar" "${wrap_dir}/ranlib" "${wrap_dir}/windres"
          }

          case "$LIB_KEY" in
            vulkan-headers)
              clone_tag
              cat > /tmp/vk_probe.c <<'EOF'
          #define VK_NO_PROTOTYPES 1
          #include <stdint.h>
          #include <vulkan/vulkan.h>
          #ifdef _WIN32
          #define B8G_EXP __declspec(dllexport)
          #else
          #define B8G_EXP __attribute__((visibility("default")))
          #endif
          B8G_EXP uint32_t b8g_vulkan_header_version(void) { return VK_HEADER_VERSION; }
          B8G_EXP uint32_t b8g_vulkan_api_version(void) { return VK_HEADER_VERSION_COMPLETE; }
          EOF
              VK_INC="-std=c11 -Isrc/include"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $VK_INC /tmp/vk_probe.c -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $VK_INC /tmp/vk_probe.c -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $VK_INC /tmp/vk_probe.c -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $VK_INC /tmp/vk_probe.c -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $VK_INC /tmp/vk_probe.c -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            spirv-headers)
              clone_tag
              cat > /tmp/spv_probe.c <<'EOF'
          #include <stdint.h>
          #include <spirv/unified1/spirv.h>
          #ifdef _WIN32
          #define B8G_EXP __declspec(dllexport)
          #else
          #define B8G_EXP __attribute__((visibility("default")))
          #endif
          B8G_EXP uint32_t b8g_spv_version(void) { return SPV_VERSION; }
          B8G_EXP uint32_t b8g_spv_magic(void) { return SpvMagicNumber; }
          EOF
              SPV_INC="-std=c11 -Isrc/include"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $SPV_INC /tmp/spv_probe.c -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $SPV_INC /tmp/spv_probe.c -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $SPV_INC /tmp/spv_probe.c -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $SPV_INC /tmp/spv_probe.c -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $SPV_INC /tmp/spv_probe.c -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            cccl)
              clone_tag
              cat > /tmp/cccl_probe.cpp <<'EOF'
          #define THRUST_HOST_SYSTEM THRUST_HOST_SYSTEM_CPP
          #define THRUST_DEVICE_SYSTEM THRUST_DEVICE_SYSTEM_CPP
          #include <cuda/std/version>
          #include <thrust/version.h>
          #include <cstdint>
          #ifdef _WIN32
          #define B8G_EXP __declspec(dllexport)
          #else
          #define B8G_EXP __attribute__((visibility("default")))
          #endif
          extern "C" {
          B8G_EXP uint32_t b8g_cccl_version(void) { return CCCL_VERSION; }
          B8G_EXP uint32_t b8g_thrust_version(void) { return THRUST_VERSION; }
          B8G_EXP uint32_t b8g_cccl_major(void) { return CCCL_MAJOR_VERSION; }
          B8G_EXP uint32_t b8g_cccl_minor(void) { return CCCL_MINOR_VERSION; }
          B8G_EXP uint32_t b8g_cccl_patch(void) { return CCCL_PATCH_VERSION; }
          }
          EOF
              CCCL_FLAGS="-std=c++17 -Isrc/libcudacxx/include -Isrc/thrust"
              zig c++ -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $CCCL_FLAGS /tmp/cccl_probe.cpp -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig c++ -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CCCL_FLAGS /tmp/cccl_probe.cpp -o "dist/${LIB_OUT}-linux-x64.so"
              zig c++ -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CCCL_FLAGS /tmp/cccl_probe.cpp -o "dist/${LIB_OUT}-linux-arm64.so"
              zig c++ -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $CCCL_FLAGS /tmp/cccl_probe.cpp -o "dist/${LIB_OUT}-macos-arm64.dylib"
              ;;

            cutlass)
              clone_tag
              cat > /tmp/cutlass_probe.cpp <<'EOF'
          #include <cutlass/version.h>
          #include <cstdint>
          #ifdef _WIN32
          #define B8G_EXP __declspec(dllexport)
          #else
          #define B8G_EXP __attribute__((visibility("default")))
          #endif
          extern "C" {
          B8G_EXP uint32_t b8g_cutlass_version(void) { return cutlass::getVersion(); }
          B8G_EXP uint32_t b8g_cutlass_major(void) { return cutlass::getVersionMajor(); }
          B8G_EXP uint32_t b8g_cutlass_minor(void) { return cutlass::getVersionMinor(); }
          B8G_EXP uint32_t b8g_cutlass_patch(void) { return cutlass::getVersionPatch(); }
          }
          EOF
              CUTLASS_FLAGS="-std=c++17 -Isrc/include"
              zig c++ -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $CUTLASS_FLAGS /tmp/cutlass_probe.cpp -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig c++ -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CUTLASS_FLAGS /tmp/cutlass_probe.cpp -o "dist/${LIB_OUT}-linux-x64.so"
              zig c++ -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CUTLASS_FLAGS /tmp/cutlass_probe.cpp -o "dist/${LIB_OUT}-linux-arm64.so"
              zig c++ -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $CUTLASS_FLAGS /tmp/cutlass_probe.cpp -o "dist/${LIB_OUT}-macos-arm64.dylib"
              ;;

            dav1d)
              clone_tag
              mkdir -p /tmp/dav1d_inc /tmp/dav1d_wasi_inc
              echo "#define DAV1D_VERSION \"${UP_VER}\"" > /tmp/dav1d_inc/vcs_version.h
              cat > /tmp/dav1d_inc/config.h <<'EOF'
          #ifndef DAV1D_CONFIG_H
          #define DAV1D_CONFIG_H
          #define CONFIG_8BPC 1
          #define CONFIG_16BPC 1
          #define HAVE_ASM 0
          #define CONFIG_ASM_DEBUG 0
          #define TRIM_DSP_FUNCTIONS 0
          #define CONFIG_LOG 1
          #define ENDIAN_LITTLE 1
          #define ENDIANNESS_BIG 0
          #define ARCH_X86 0
          #define ARCH_X86_64 0
          #define ARCH_X86_32 0
          #define ARCH_AARCH64 0
          #define ARCH_ARM 0
          #define ARCH_PPC64LE 0
          #define ARCH_RISCV 0
          #define ARCH_RV32 0
          #define ARCH_RV64 0
          #define ARCH_LOONGARCH 0
          #define ARCH_LOONGARCH32 0
          #define ARCH_LOONGARCH64 0
          #define HAVE_C11_GENERIC 1
          #define HAVE_DLSYM 0
          #define HAVE_PTHREAD_GETAFFINITY_NP 0
          #define HAVE_PTHREAD_SETAFFINITY_NP 0
          #define HAVE_PTHREAD_SETNAME_NP 0
          #define HAVE_PTHREAD_SET_NAME_NP 0
          #define HAVE_PTHREAD_NP_H 0
          #define HAVE_GETAUXVAL 0
          #define HAVE_ELF_AUX_INFO 0
          #define HAVE_SIGACTION 0
          #define HAVE_SYS_TYPES_H 1
          #ifdef _WIN32
          #define _WIN32_WINNT 0x0601
          #define _FILE_OFFSET_BITS 64
          #define fseeko _fseeki64
          #define ftello _ftelli64
          #define HAVE_CLOCK_GETTIME 0
          #define HAVE_POSIX_MEMALIGN 0
          #define HAVE_MEMALIGN 0
          #define HAVE_ALIGNED_ALLOC 0
          #define HAVE_UNISTD_H 0
          #define HAVE_IO_H 1
          #else
          #define HAVE_CLOCK_GETTIME 1
          #define HAVE_POSIX_MEMALIGN 1
          #define HAVE_MEMALIGN 0
          #define HAVE_ALIGNED_ALLOC 1
          #define HAVE_UNISTD_H 1
          #define HAVE_IO_H 0
          #endif
          #endif
          EOF
              cat > /tmp/dav1d_wasi_inc/pthread.h <<'EOF'
          #ifndef _WASI_PTHREAD_STUB_H
          #define _WASI_PTHREAD_STUB_H
          #include <errno.h>
          #include <stddef.h>
          typedef int pthread_t;
          typedef int pthread_attr_t;
          typedef int pthread_mutex_t;
          typedef int pthread_mutexattr_t;
          typedef int pthread_cond_t;
          typedef int pthread_condattr_t;
          typedef int pthread_once_t;
          #define PTHREAD_MUTEX_INITIALIZER 0
          #define PTHREAD_COND_INITIALIZER 0
          #define PTHREAD_ONCE_INIT 0
          static inline int pthread_attr_init(pthread_attr_t *a) { (void)a; return 0; }
          static inline int pthread_attr_destroy(pthread_attr_t *a) { (void)a; return 0; }
          static inline int pthread_attr_setstacksize(pthread_attr_t *a, size_t s) { (void)a; (void)s; return 0; }
          static inline int pthread_create(pthread_t *t, const pthread_attr_t *a, void *(*fn)(void *), void *arg) { (void)t; (void)a; (void)fn; (void)arg; return ENOSYS; }
          static inline int pthread_join(pthread_t t, void **ret) { (void)t; (void)ret; return 0; }
          static inline int pthread_mutex_init(pthread_mutex_t *m, const pthread_mutexattr_t *a) { (void)m; (void)a; return 0; }
          static inline int pthread_mutex_destroy(pthread_mutex_t *m) { (void)m; return 0; }
          static inline int pthread_mutex_lock(pthread_mutex_t *m) { (void)m; return 0; }
          static inline int pthread_mutex_trylock(pthread_mutex_t *m) { (void)m; return 0; }
          static inline int pthread_mutex_unlock(pthread_mutex_t *m) { (void)m; return 0; }
          static inline int pthread_cond_init(pthread_cond_t *c, const pthread_condattr_t *a) { (void)c; (void)a; return 0; }
          static inline int pthread_cond_destroy(pthread_cond_t *c) { (void)c; return 0; }
          static inline int pthread_cond_wait(pthread_cond_t *c, pthread_mutex_t *m) { (void)c; (void)m; return 0; }
          static inline int pthread_cond_signal(pthread_cond_t *c) { (void)c; return 0; }
          static inline int pthread_cond_broadcast(pthread_cond_t *c) { (void)c; return 0; }
          static inline int pthread_once(pthread_once_t *o, void (*fn)(void)) { if (o && !*o) { *o = 1; fn(); } return 0; }
          #endif
          EOF
              DAV1D_CORE="src/src/cdf.c src/src/cpu.c src/src/ctx.c src/src/data.c src/src/decode.c src/src/dequant_tables.c src/src/getbits.c src/src/intra_edge.c src/src/itx_1d.c src/src/lf_mask.c src/src/lib.c src/src/log.c src/src/mem.c src/src/msac.c src/src/obu.c src/src/pal.c src/src/picture.c src/src/qm.c src/src/ref.c src/src/refmvs.c src/src/scan.c src/src/tables.c src/src/thread_task.c src/src/warpmv.c src/src/wedge.c"
              DAV1D_TMPL="src/src/cdef_apply_tmpl.c src/src/cdef_tmpl.c src/src/fg_apply_tmpl.c src/src/filmgrain_tmpl.c src/src/ipred_prepare_tmpl.c src/src/ipred_tmpl.c src/src/itx_tmpl.c src/src/lf_apply_tmpl.c src/src/loopfilter_tmpl.c src/src/looprestoration_tmpl.c src/src/lr_apply_tmpl.c src/src/mc_tmpl.c src/src/recon_tmpl.c"
              DAV1D_INC="-std=c11 -I/tmp/dav1d_inc -Isrc -Isrc/include -Isrc/src -DENDIAN_LITTLE=1 -DARCH_X86=0 -DARCH_AARCH64=0"

              build_dav1d_target() {
                local t="$1"
                local cflags="$2"
                local lflags="$3"
                local extra_srcs="$4"
                local out="$5"
                local odir="/tmp/dav1d_obj_${t}"
                mkdir -p "$odir"
                local objs=""
                for f in $DAV1D_TMPL; do
                  local b
                  b=$(basename "$f" .c)
