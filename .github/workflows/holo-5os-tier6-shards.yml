name: Holo 5-OS Tier-6 Shards — Runtime Libraries, Tools & GPU/NPU ABI Probes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * 0'
  push:
    branches: [main]
    paths: ['.github/workflows/holo-5os-tier6-shards.yml', '.github/workflows/holo-5os-tier6-shards.mts']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: false }
env: { GH_TOKEN: "${{ github.token }}" }

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - id: resolve
        env: { TAG: "${{ inputs.release_tag || 'v11-max-5os-latest' }}" }
        run: node .github/workflows/holo-5os-tier6-shards.mts resolve
      - uses: actions/upload-artifact@v7
        with: { name: resolved-tier6-versions, path: resolved-tier6-versions.json, retention-days: 7 }

  build-tier6-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - protobuf
          - icu4c
          - vips
          - openblas
          - onednn
          - cmake
          - nccl
          - rocm
          - triton
          - flash-attention
          - xdna-driver
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.14.0 }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier6-shards.yml', '.github/workflows/holo-5os-tier6-shards.mts') }}
          restore-keys: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
        run: node .github/workflows/holo-5os-tier6-shards.mts build
      - name: Upload smoke-failure report & linux-x64 binaries
        if: failure()
        uses: actions/upload-artifact@v5
        with: { name: "tier6-smoke-failure-${{ matrix.lib }}", path: "dist/smoke-failure-report.txt\ndist/*-linux-x64.*\ndist/*-linux-x64", retention-days: 1, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with: { name: "tier6-sums-${{ matrix.lib }}", path: "dist/SHA512SUMS-${{ matrix.lib }}.txt", retention-days: 7 }
      - if: ${{ steps.build.outputs.skipped != 'true' }}
        env: { TAG: "${{ needs.ensure-release.outputs.release_tag }}" }
        run: node .github/workflows/holo-workflow-runtime.mts upload
      - uses: actions/attest-build-provenance@v4
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with: { subject-path: 'dist/*' }

  finalize-tier6-sums:
    needs: [ensure-release, build-tier6-5os-shard]
    if: ${{ !cancelled() && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: actions/download-artifact@v8
        with: { path: /tmp/artifacts }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - env: { TAG: "${{ needs.ensure-release.outputs.release_tag }}" }
        run: node .github/workflows/holo-5os-tier6-shards.mts finalize
      - uses: actions/attest-build-provenance@v4
        if: ${{ hashFiles('/tmp/SHA512SUMS-tier6.txt') != '' }}
        with: { subject-path: '/tmp/SHA512SUMS-tier6.txt' }
