              ARC_COMMON=$(find src/libarchive -maxdepth 1 -name '*.c' \
                ! -name 'test_*' ! -name '*_windows.c' ! -name '*_bhfi.c' ! -name 'filter_fork_windows.c' \
                ! -name 'archive_disk_acl_*' ! -name '*_darwin.c' ! -name '*_freebsd.c' ! -name '*_linux.c' ! -name '*_sunos.c' | sort)
              ARC_WIN=$(find src/libarchive -maxdepth 1 -name '*.c' \
                ! -name 'test_*' ! -name 'archive_disk_acl_*' ! -name '*_darwin.c' ! -name '*_freebsd.c' ! -name '*_linux.c' ! -name '*_sunos.c' | sort)
              ARC_FLAGS="-I/tmp/arc_inc -Isrc/libarchive -DHAVE_CONFIG_H"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $ARC_FLAGS $ARC_WIN -lbcrypt -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $ARC_FLAGS $ARC_COMMON -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $ARC_FLAGS $ARC_COMMON -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $ARC_FLAGS $ARC_COMMON -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $ARC_FLAGS "-Dumask(m)=(0)" "-Ddup(fd)=(fd)" -D_WASI_EMULATED_GETPID $ARC_COMMON -lwasi-emulated-getpid -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;
          esac

          echo "=== Verifying produced binaries & runtime smoke tests ==="
          shopt -s nullglob
          for f in dist/*.dll dist/*.so dist/*.dylib dist/*.wasm dist/*.dll.a; do
            test -s "$f" || { echo "ERROR: empty artifact $f"; exit 1; }
            file "$f"
          done

          cat > /tmp/dlprobe.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (argc < 2) return 2;
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) {
              fprintf(stderr, "dlopen(%s) failed: %s\n", argv[1], dlerror());
              return 1;
            }
            printf("dlopen(%s) OK\n", argv[1]);
            dlclose(h);
            return 0;
          }
          EOF
          zig cc -target x86_64-linux-gnu -O2 /tmp/dlprobe.c -ldl -o /tmp/dlprobe
          LD_LIBRARY_PATH="${DL_LD_LIBRARY_PATH}" /tmp/dlprobe "dist/${LIB_OUT}-linux-x64.so"

          if [ -f "dist/${LIB_OUT}-wasm32-wasi.wasm" ]; then
            node -e '
              const fs = require("node:fs");
              const p = process.argv[1];
              const buf = fs.readFileSync(p);
              if (buf.length < 8 || buf[0] !== 0x00 || buf[1] !== 0x61 || buf[2] !== 0x73 || buf[3] !== 0x6d) {
                console.error("Invalid WASM magic header in", p);
                process.exit(1);
              }
              if (!WebAssembly.validate(buf)) {
                console.error("WebAssembly.validate failed in", p);
                process.exit(1);
              }
              console.log("WebAssembly.validate OK:", p, buf.length, "bytes");
            ' "dist/${LIB_OUT}-wasm32-wasi.wasm"
          fi

          (cd dist && sha512sum * > "SHA512SUMS-${LIB_KEY}.txt")
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const distDir = "dist";
            const files = fs.readdirSync(distDir)
              .filter(f => /\.(dll|so|dylib|wasm|dll\.a)$/.test(f))
              .sort();
            const artifacts = files.map(name => {
              const buf = fs.readFileSync(path.join(distDir, name));
              return {
                name,
                size: buf.length,
                sha512: crypto.createHash("sha512").update(buf).digest("hex")
              };
            });
            const receipt = {
              schema: "holo-v11.shard-receipt.v1",
              pkg: process.env.LIB_KEY,
              libOut: process.env.LIB_OUT,
              repo: process.env.UP_REPO,
              tag: process.env.UP_TAG,
              version: process.env.UP_VER,
              deterministic: true,
              artifacts
            };
            fs.writeFileSync(
              path.join(distDir, `${process.env.LIB_OUT}-receipt.json`),
              JSON.stringify(receipt, null, 2) + "\n"
            );
          '
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with:
          name: tier3-sums-${{ matrix.lib }}
          path: dist/SHA512SUMS-${{ matrix.lib }}.txt

      - name: Upload Tier-3 5-OS Shard Binaries & Receipt to GitHub Release
        if: ${{ steps.build.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

      - name: Attest SLSA Build Provenance for ${{ matrix.lib }} Shard & Receipt
        if: ${{ steps.build.outputs.skipped != 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

  finalize-tier3-sums:
    needs: [ensure-release, build-tier3-5os-shard]
    if: ${{ !cancelled() && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Summarize Tier-3 Shards & Upload Tier-3 SHA512SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = "/tmp/artifacts";
            const resolvedPath = path.join(root, "resolved-tier3-versions", "resolved-tier3-versions.json");
            const resolved = fs.existsSync(resolvedPath) ? JSON.parse(fs.readFileSync(resolvedPath, "utf8")).libraries : {};
            const expected = Object.keys(resolved);

            const sumLines = [];
            const rows = [];
            let passedCount = 0;

            for (const lib of expected) {
              const sumFile = path.join(root, `tier3-sums-${lib}`, `SHA512SUMS-${lib}.txt`);
              if (!fs.existsSync(sumFile)) {
                rows.push(`| \`${lib}\` | ${resolved[lib].tag} | FAILED | - |`);
                continue;
              }
              const lines = fs.readFileSync(sumFile, "utf8").trim().split(/\r?\n/).filter(Boolean);
              const targets = [];
              for (const line of lines) {
                const [sha, name] = line.trim().split(/\s+/);
                if (!sha || !name || name.endsWith(".txt")) continue;
                sumLines.push(`${sha}  ${name}`);
                if (name.endsWith("-win64.dll")) targets.push("win64");
                else if (name.endsWith("-linux-x64.so")) targets.push("linux-x64");
                else if (name.endsWith("-linux-arm64.so")) targets.push("linux-arm64");
                else if (name.endsWith("-macos-arm64.dylib")) targets.push("macos-arm64");
                else if (name.endsWith("-wasm32-wasi.wasm")) targets.push("wasm32-wasi");
              }
              passedCount++;
              rows.push(`| \`${lib}\` | ${resolved[lib].tag} | PASS | ${targets.join(", ")} |`);
            }

            fs.writeFileSync("/tmp/SHA512SUMS-tier3.txt", sumLines.join("\n") + "\n");
            const summary = [
              `## Holo 5-OS Tier-3 Shards (${process.env.TAG})`,
              "",
              `- **Passed:** ${passedCount}/${expected.length}`,
              "",
              "| Library | Tag | Status | Targets |",
              "| :--- | :--- | :--- | :--- |",
              ...rows,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          '
          if [ -s /tmp/SHA512SUMS-tier3.txt ]; then
            gh release upload "$TAG" /tmp/SHA512SUMS-tier3.txt --repo awesome-os/upstream-mirrors --clobber
          fi

      - name: Attest SLSA Build Provenance for Tier-3 Checksums
        if: ${{ hashFiles('/tmp/SHA512SUMS-tier3.txt') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '/tmp/SHA512SUMS-tier3.txt'
