name: Holo 5-OS Tier-3 Shards — Pure Zig 0.14.0 Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-tier3-shards.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure GitHub Release & Resolve Tier-3 Upstream Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: |
          gh release view "$TAG" --repo awesome-os/upstream-mirrors >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/upstream-mirrors \
              --title "Holo v11 Max 5-OS Shared + WASI Libraries (${TAG})" \
              --notes "Production max-version 5-OS shared libraries (Win64 .dll, Linux x64/ARM64 .so, macOS ARM64 .dylib, wasm32-wasi .wasm) compiled directly from upstream sources via pure holo-compiler (zig 0.14.0) — zero CMake, zero Ninja, zero Make."

          node -e '
            const fs = require("node:fs");
            const defaults = {
              pixman:          { pkg: "pixman",        libOut: "libpixman",      repo: "gitlab.freedesktop.org/pixman/pixman", tag: "pixman-0.46.4", version: "0.46.4" },
              "libjpeg-turbo": { pkg: "libjpeg-turbo", libOut: "libjpeg-turbo",  repo: "libjpeg-turbo/libjpeg-turbo",          tag: "3.2.1",         version: "3.2.1" },
              libffi:          { pkg: "libffi",        libOut: "libffi",         repo: "libffi/libffi",                        tag: "v3.8.2",        version: "3.8.2" },
              ngtcp2:          { pkg: "ngtcp2",        libOut: "libngtcp2",      repo: "ngtcp2/ngtcp2",                        tag: "v1.26.0",       version: "1.26.0" },
              libxml2:         { pkg: "libxml2",       libOut: "libxml2",        repo: "GNOME/libxml2",                        tag: "v2.15.4",       version: "2.15.4" },
              libxslt:         { pkg: "libxslt",       libOut: "libxslt",        repo: "GNOME/libxslt",                        tag: "v1.1.45",       version: "1.1.45" },
              woff2:           { pkg: "woff2",         libOut: "libwoff2",       repo: "google/woff2",                         tag: "v1.0.2",        version: "1.0.2" },
              libarchive:      { pkg: "libarchive",    libOut: "libarchive",     repo: "libarchive/libarchive",                tag: "v3.8.11",       version: "3.8.11" }
            };

            (async () => {
              const resolved = structuredClone(defaults);
              try {
                const res = await fetch("https://raw.githubusercontent.com/awesome-os/t2linux-baseline/main/catalog/live-upstream-tracker.json");
                if (res.ok) {
                  const tracker = await res.json();
                  const byPkg = new Map((tracker.libraries || []).map(x => [x.pkg, x]));
                  for (const cfg of Object.values(resolved)) {
                    const hit = byPkg.get(cfg.pkg);
                    if (hit && hit.upstreamTag) {
                      cfg.tag = hit.upstreamTag;
                      cfg.version = hit.upstreamVersion || hit.upstreamTag.replace(/^v/, "");
                      if (hit.repo && hit.repo.includes("/") && !hit.repo.includes("sourceforge.net")) {
                        cfg.repo = hit.repo;
                      }
                    }
                  }
                }
              } catch (err) {
                console.warn("[warn] tracker fetch failed, using safe defaults:", err.message);
              }

              const payload = {
                schema: "holo-v11.resolved-versions.v1",
                tier: "tier3",
                resolvedAt: new Date().toISOString(),
                releaseTag: process.env.TAG,
                libraries: resolved
              };
              fs.writeFileSync("resolved-tier3-versions.json", JSON.stringify(payload, null, 2) + "\n");
              const compact = JSON.stringify(resolved);
              const outFile = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(outFile, `release_tag=${process.env.TAG}\n`);
              fs.appendFileSync(outFile, `versions_json=${compact}\n`);
              console.log("Resolved 8 Tier-3 libraries:", JSON.stringify(resolved, null, 2));
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-tier3-versions
          path: resolved-tier3-versions.json

  build-tier3-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - pixman
          - libjpeg-turbo
          - libffi
          - ngtcp2
          - libxml2
          - libxslt
          - woff2
          - libarchive
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/holo-5os-tier3-shards.yml

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier3-shards.yml') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compile ${{ matrix.lib }} for 5 OS Targets via Pure Zig 0.14.0 + Smoke Test
        id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const v = JSON.parse(process.env.VERSIONS_JSON)[process.env.LIB_KEY];
            console.log(`export UP_REPO=${JSON.stringify(v.repo)}`);
            console.log(`export UP_TAG=${JSON.stringify(v.tag)}`);
            console.log(`export UP_VER=${JSON.stringify(v.version)}`);
            console.log(`export LIB_OUT=${JSON.stringify(v.libOut)}`);
          ')"
          echo "lib_out=${LIB_OUT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_REBUILD}" != "true" ]; then
            ASSETS_JSON=$(gh release view "$RELEASE_TAG" --repo awesome-os/upstream-mirrors --json assets 2>/dev/null || echo '{"assets":[]}')
            RECEIPT_NAME="${LIB_OUT}-receipt.json"
            if node -e '
              const assets = JSON.parse(process.argv[1]).assets || [];
              process.exit(assets.some(a => a.name === process.argv[2]) ? 0 : 1);
            ' "$ASSETS_JSON" "$RECEIPT_NAME"; then
              mkdir -p /tmp/skip-check
              if gh release download "$RELEASE_TAG" --repo awesome-os/upstream-mirrors -p "$RECEIPT_NAME" -D /tmp/skip-check --clobber >/dev/null 2>&1; then
                if node -e '
                  const fs = require("node:fs");
                  const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const assets = new Set((JSON.parse(process.argv[2]).assets || []).map(a => a.name));
                  const upVer = process.argv[3];
                  const ok = receipt &&
                    receipt.version === upVer &&
                    Array.isArray(receipt.artifacts) &&
                    receipt.artifacts.length > 0 &&
                    receipt.artifacts.every(a => a && typeof a.name === "string" && assets.has(a.name));
                  process.exit(ok ? 0 : 1);
                ' "/tmp/skip-check/${RECEIPT_NAME}" "$ASSETS_JSON" "$UP_VER"; then
                  echo "skipped=true" >> "$GITHUB_OUTPUT"
                  echo "SKIP: ${LIB_KEY} ${UP_VER} already materialized"
                  exit 0
                fi
              fi
            fi
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          echo "=== Building ${LIB_KEY} (${LIB_OUT}) @ ${UP_REPO} ${UP_TAG} (${UP_VER}) ==="

          mkdir -p src dist
          DET_FLAGS="-ffile-prefix-map=$PWD=."
          DET_LINUX_FLAGS="-ffile-prefix-map=$PWD=. -Wl,--build-id=none"
          DL_LD_LIBRARY_PATH=""

          clone_tag() {
            local repo_url="https://github.com/${UP_REPO}.git"
            if [[ "$UP_REPO" == gitlab.* ]]; then
              repo_url="https://${UP_REPO}.git"
            fi
            git clone --depth=1 --branch "$UP_TAG" "$repo_url" src
          }

          gen_libxml2_headers() {
            local xml_src="$1"
            local xml_inc="$2"
            mkdir -p "${xml_inc}/libxml"
            node -e '
              const fs = require("node:fs");
              const ver = fs.readFileSync(process.argv[1], "utf8").trim();
              const [maj = "2", min = "15", mic = "0"] = ver.split(".");
              const num = String(Number(maj) * 10000 + Number(min) * 100 + Number(mic));
              let tpl = fs.readFileSync(process.argv[2], "utf8");
              const reps = {
                "@VERSION@": ver,
                "@LIBXML_VERSION_NUMBER@": num,
                "@LIBXML_VERSION_EXTRA@": "",
                "@WITH_THREADS@": "0",
                "@WITH_THREAD_ALLOC@": "0",
                "@WITH_OUTPUT@": "1",
                "@WITH_PUSH@": "1",
                "@WITH_READER@": "1",
                "@WITH_PATTERN@": "1",
                "@WITH_WRITER@": "1",
                "@WITH_SAX1@": "1",
                "@WITH_HTTP@": "1",
                "@WITH_VALID@": "1",
                "@WITH_HTML@": "1",
                "@WITH_C14N@": "1",
                "@WITH_CATALOG@": "1",
                "@WITH_XPATH@": "1",
                "@WITH_XPTR@": "1",
                "@WITH_XINCLUDE@": "1",
                "@WITH_ICONV@": "0",
                "@WITH_ICU@": "0",
                "@WITH_ISO8859X@": "1",
                "@WITH_DEBUG@": "1",
                "@WITH_REGEXPS@": "1",
                "@WITH_RELAXNG@": "1",
                "@WITH_SCHEMAS@": "1",
                "@WITH_SCHEMATRON@": "0",
                "@WITH_MODULES@": "0",
                "@MODULE_EXTENSION@": ".so",
                "@WITH_ZLIB@": "0"
              };
              for (const [k, v] of Object.entries(reps)) tpl = tpl.replaceAll(k, v);
              fs.writeFileSync(process.argv[3], tpl);
            ' "${xml_src}/VERSION" "${xml_src}/include/libxml/xmlversion.h.in" "${xml_inc}/libxml/xmlversion.h"
            cat > "${xml_inc}/config.h" <<'EOF'
          #define HAVE_STDINT_H 1
          #define HAVE_DECL_GETENTROPY 0
          #define HAVE_DECL_GLOB 0
          #define HAVE_DECL_MMAP 0
          #define XML_SYSCONFDIR "/etc"
          EOF
          }

          XML2_REL_SRCS="buf.c chvalid.c dict.c encoding.c entities.c error.c globals.c hash.c list.c parser.c parserInternals.c SAX2.c threads.c tree.c uri.c valid.c xmlIO.c xmlmemory.c xmlstring.c c14n.c catalog.c debugXML.c HTMLparser.c HTMLtree.c nanohttp.c xmlsave.c pattern.c xmlreader.c xmlregexp.c relaxng.c xmlschemas.c xmlschemastypes.c xmlwriter.c xinclude.c xpath.c xlink.c xpointer.c"

          case "$LIB_KEY" in
            pixman)
              if ! clone_tag; then
                rm -rf src && git clone --depth=1 --branch "pixman-0.44.2" "https://gitlab.freedesktop.org/pixman/pixman.git" src
              fi
              mkdir -p /tmp/pix_inc
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^pixman-/, "").split("-")[0];
                const [maj = "0", min = "46", mic = "0"] = ver.split(".");
                let tpl = fs.readFileSync("src/pixman/pixman-version.h.in", "utf8");
                tpl = tpl
                  .replaceAll("@PIXMAN_VERSION_MAJOR@", maj)
                  .replaceAll("@PIXMAN_VERSION_MINOR@", min)
                  .replaceAll("@PIXMAN_VERSION_MICRO@", mic);
                fs.writeFileSync("/tmp/pix_inc/pixman-version.h", tpl);
              '
              cat > /tmp/pix_inc/pixman-config.h <<'EOF'
          #define PACKAGE "pixman"
          #define HAVE_PTHREADS 0
          EOF
              PIX_SRCS="src/pixman/pixman.c src/pixman/pixman-access.c src/pixman/pixman-access-accessors.c src/pixman/pixman-arm.c src/pixman/pixman-bits-image.c src/pixman/pixman-combine32.c src/pixman/pixman-combine-float.c src/pixman/pixman-conical-gradient.c src/pixman/pixman-edge.c src/pixman/pixman-edge-accessors.c src/pixman/pixman-fast-path.c src/pixman/pixman-filter.c src/pixman/pixman-glyph.c src/pixman/pixman-general.c src/pixman/pixman-gradient-walker.c src/pixman/pixman-image.c src/pixman/pixman-implementation.c src/pixman/pixman-linear-gradient.c src/pixman/pixman-matrix.c src/pixman/pixman-mips.c src/pixman/pixman-noop.c src/pixman/pixman-ppc.c src/pixman/pixman-radial-gradient.c src/pixman/pixman-region16.c src/pixman/pixman-region32.c src/pixman/pixman-region64f.c src/pixman/pixman-riscv.c src/pixman/pixman-solid-fill.c src/pixman/pixman-timer.c src/pixman/pixman-trap.c src/pixman/pixman-utils.c src/pixman/pixman-x86.c"
              PIX_FLAGS="-I/tmp/pix_inc -Isrc/pixman -DPACKAGE=pixman -DPIXMAN_NO_TLS"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $PIX_FLAGS '-DPIXMAN_API=__declspec(dllexport)' $PIX_SRCS -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $PIX_FLAGS $PIX_SRCS -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $PIX_FLAGS $PIX_SRCS -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $PIX_FLAGS $PIX_SRCS -lm -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $PIX_FLAGS $PIX_SRCS -lm -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            libjpeg-turbo)
              clone_tag
              mkdir -p /tmp/jpg_inc
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "3", min = "2", rev = "0"] = ver.split(".");
                const verNum = `${maj}${min.padStart(3, "0")}${rev.padStart(3, "0")}`;
                fs.writeFileSync("/tmp/jpg_inc/jconfig.h", `#define JPEG_LIB_VERSION 80
          #define LIBJPEG_TURBO_VERSION ${ver}
          #define LIBJPEG_TURBO_VERSION_NUMBER ${verNum}
          #define C_ARITH_CODING_SUPPORTED 1
          #define D_ARITH_CODING_SUPPORTED 1
          #define MEM_SRCDST_SUPPORTED 1
          #ifndef BITS_IN_JSAMPLE
          #define BITS_IN_JSAMPLE 8
          #endif
          #ifdef _WIN32
          #undef RIGHT_SHIFT_IS_UNSIGNED
          #ifndef __RPCNDR_H__
          typedef unsigned char boolean;
          #endif
          #define HAVE_BOOLEAN
          #if !(defined(_BASETSD_H_) || defined(_BASETSD_H))
          typedef short INT16;
          typedef signed int INT32;
          #endif
          #define XMD_H
          #endif
          `);
                fs.writeFileSync("/tmp/jpg_inc/jconfigint.h", `#define BUILD "20261127"
          #define HIDDEN __attribute__((visibility("hidden")))
          #define INLINE inline __attribute__((always_inline))
          #ifdef _WIN32
          #define THREAD_LOCAL __declspec(thread)
          #else
          #define THREAD_LOCAL __thread
          #endif
          #define PACKAGE_NAME "libjpeg-turbo"
          #define VERSION "${ver}"
          #define SIZEOF_SIZE_T __SIZEOF_SIZE_T__
          #define HAVE_BUILTIN_CTZL 1
          #define FALLTHROUGH __attribute__((fallthrough));
          #ifndef BITS_IN_JSAMPLE
          #define BITS_IN_JSAMPLE 8
          #endif
          #if BITS_IN_JSAMPLE == 8
          #define C_ARITH_CODING_SUPPORTED 1
          #define D_ARITH_CODING_SUPPORTED 1
          #define SIMD_ARCHITECTURE NONE
          #endif
          `);
                let jv = fs.readFileSync("src/src/jversion.h.in", "utf8");
                jv = jv.replaceAll("@COPYRIGHT_YEAR@", "1991-2026");
                fs.writeFileSync("/tmp/jpg_inc/jversion.h", jv);
              '
              JPG_CORE="src/src/jcapimin.c src/src/jchuff.c src/src/jcicc.c src/src/jcinit.c src/src/jclhuff.c src/src/jcmarker.c src/src/jcmaster.c src/src/jcomapi.c src/src/jcparam.c src/src/jcphuff.c src/src/jctrans.c src/src/jdapimin.c src/src/jdatadst.c src/src/jdatasrc.c src/src/jdhuff.c src/src/jdicc.c src/src/jdinput.c src/src/jdlhuff.c src/src/jdmarker.c src/src/jdmaster.c src/src/jdphuff.c src/src/jdtrans.c src/src/jerror.c src/src/jfdctflt.c src/src/jmemmgr.c src/src/jmemnobs.c src/src/jpeg_nbits.c src/src/jaricom.c src/src/jcarith.c src/src/jdarith.c"
              JPG_WRAP=$(find src/src/wrapper -maxdepth 1 -name '*.c' ! -name 'template.c' ! -name 'rdpng*' ! -name 'wrpng*' ! -name 'rdppm*' ! -name 'wrppm*' | sort)
              JPG_FLAGS="-I/tmp/jpg_inc -Isrc/src"
              zig cc -target x86_64-windows-gnu -O2 -shared -s -Wl,--export-all-symbols $DET_FLAGS $JPG_FLAGS $JPG_CORE $JPG_WRAP -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $JPG_FLAGS $JPG_CORE $JPG_WRAP -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $JPG_FLAGS $JPG_CORE $JPG_WRAP -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $JPG_FLAGS $JPG_CORE $JPG_WRAP -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $JPG_FLAGS $JPG_CORE $JPG_WRAP -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            libffi)
              clone_tag
              mkdir -p /tmp/ffi_inc
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "3", min = "8", pat = "0"] = ver.split(".");
                const verNum = String(Number(maj) * 10000 + Number(min) * 100 + Number(pat));
                let tpl = fs.readFileSync("src/include/ffi.h.in", "utf8");
                tpl = tpl
                  .replaceAll("@VERSION@", ver)
                  .replaceAll("@TARGET@", "TARGET_PLACEHOLDER")
                  .replaceAll("@HAVE_LONG_DOUBLE@", "0")
                  .replaceAll("@HAVE_LONG_DOUBLE_VARIANT@", "0")
                  .replaceAll("@FFI_EXEC_TRAMPOLINE_TABLE@", "0")
                  .replaceAll("@FFI_VERSION_NUMBER@", verNum)
                  .replace("#ifndef TARGET_PLACEHOLDER", "#ifndef LIBFFI_TARGET_DEFINED")
                  .replace("#define TARGET_PLACEHOLDER", "#define LIBFFI_TARGET_DEFINED");
                fs.writeFileSync("/tmp/ffi_inc/ffi.h", tpl);
              '
              cat > /tmp/ffi_inc/fficonfig.h <<'EOF'
          #define PACKAGE "libffi"
          #define PACKAGE_VERSION "3.8.2"
          #define VERSION "3.8.2"
          #define STDC_HEADERS 1
          #define HAVE_STDINT_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_MEMCPY 1
          #define FFI_EXEC_TRAMPOLINE_TABLE 0
          #if !defined(_WIN32) && !defined(__wasi__)
          #define HAVE_ALLOCA_H 1
          #define HAVE_MMAP_FILE 1
          #define HAVE_MMAP_DEV_ZERO 1
          #define HAVE_MMAP_ANON 1
          #define HAVE_SYS_MMAN_H 1
          #define HAVE_MKOSTEMP 1
          #endif
          #ifdef __APPLE__
          #define HAVE_RO_EH_FRAME 1
          #endif
          #define EH_FRAME_FLAGS "a"
          #if defined(__GNUC__) && !defined(_WIN32)
          #  ifdef LIBFFI_ASM
          #    ifdef __APPLE__
          #      define FFI_HIDDEN(name) .private_extern name
          #    else
          #      define FFI_HIDDEN(name) .hidden name
          #    endif
          #  else
          #    define FFI_HIDDEN __attribute__ ((visibility ("hidden")))
          #  endif
          #else
          #  ifdef LIBFFI_ASM
          #    define FFI_HIDDEN(name)
          #  else
          #    define FFI_HIDDEN
          #  endif
          #endif
          EOF
              FFI_COMMON="src/src/prep_cif.c src/src/types.c src/src/raw_api.c src/src/java_raw_api.c src/src/closures.c src/src/tramp.c"
              FFI_BASE="-I/tmp/ffi_inc -Isrc/include -Isrc/src"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $FFI_BASE -Isrc/src/x86 -DX86_WIN64 -DFFI_BUILDING_DLL $FFI_COMMON src/src/x86/ffiw64.c src/src/x86/win64.S -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $FFI_BASE -Isrc/src/x86 -DX86_64 $FFI_COMMON src/src/x86/ffi64.c src/src/x86/unix64.S src/src/x86/ffiw64.c src/src/x86/win64.S -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $FFI_BASE -Isrc/src/aarch64 -DAARCH64 $FFI_COMMON src/src/aarch64/ffi.c src/src/aarch64/sysv.S -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $FFI_BASE -Isrc/src/aarch64 -DAARCH64 $FFI_COMMON src/src/aarch64/ffi.c src/src/aarch64/sysv.S -o "dist/${LIB_OUT}-macos-arm64.dylib"
              ;;

            ngtcp2)
              git clone --depth=1 --recurse-submodules --shallow-submodules --branch "$UP_TAG" "https://github.com/${UP_REPO}.git" src
              mkdir -p /tmp/ngtcp2_inc/ngtcp2
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "1", min = "0", pat = "0"] = ver.split(".");
                const hex = "0x" + [maj, min, pat].map(x => Number(x).toString(16).padStart(2, "0")).join("");
                let tpl = fs.readFileSync("src/lib/includes/ngtcp2/version.h.in", "utf8");
                tpl = tpl.replaceAll("@PACKAGE_VERSION@", ver).replaceAll("@PACKAGE_VERSION_NUM@", hex);
                fs.writeFileSync("/tmp/ngtcp2_inc/ngtcp2/version.h", tpl);
              '
              NGT_SRCS=$(find src/lib -maxdepth 1 -name 'ngtcp2_*.c' | sort)
              NGT_FLAGS="-I/tmp/ngtcp2_inc -Isrc/lib/includes -Isrc/lib -DBUILDING_NGTCP2"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -DHAVE_WINSOCK2_H=1 $NGT_FLAGS $NGT_SRCS -lws2_32 -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NGT_FLAGS $NGT_SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NGT_FLAGS $NGT_SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NGT_FLAGS $NGT_SRCS -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NGT_FLAGS $NGT_SRCS -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            libxml2)
              clone_tag
              gen_libxml2_headers "src" "/tmp/xml_inc"
              XML2_SRCS=$(for f in $XML2_REL_SRCS; do echo "src/$f"; done)
              XML2_FLAGS="-I/tmp/xml_inc -Isrc/include -Isrc -DHAVE_CONFIG_H"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $XML2_FLAGS -DIN_LIBXML $XML2_SRCS -lbcrypt -lws2_32 -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XML2_FLAGS $XML2_SRCS -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XML2_FLAGS $XML2_SRCS -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $XML2_FLAGS $XML2_SRCS -lm -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $XML2_FLAGS "-Ddup(x)=(x)" $XML2_SRCS -lm -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            libxslt)
              clone_tag
              git clone --depth=1 --branch "v2.15.4" "https://github.com/GNOME/libxml2.git" /tmp/libxml2_src
              gen_libxml2_headers "/tmp/libxml2_src" "/tmp/xml_inc"
              mkdir -p /tmp/xml2_dist /tmp/xslt_inc/libxslt /tmp/xslt_inc/libexslt

              XML2_TMP_SRCS=$(for f in $XML2_REL_SRCS; do echo "/tmp/libxml2_src/$f"; done)
              XML2_TMP_FLAGS="-I/tmp/xml_inc -I/tmp/libxml2_src/include -I/tmp/libxml2_src -DHAVE_CONFIG_H"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $XML2_TMP_FLAGS -DIN_LIBXML $XML2_TMP_SRCS -lbcrypt -lws2_32 -o "/tmp/xml2_dist/libxml2-win64.dll" "-Wl,--out-implib,/tmp/xml2_dist/libxml2-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XML2_TMP_FLAGS -Wl,-soname,libxml2-linux-x64.so $XML2_TMP_SRCS -lm -o "/tmp/xml2_dist/libxml2-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XML2_TMP_FLAGS -Wl,-soname,libxml2-linux-arm64.so $XML2_TMP_SRCS -lm -o "/tmp/xml2_dist/libxml2-linux-arm64.so"

              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "1", min = "1", mic = "0"] = ver.split(".");
                const num = String(Number(maj) * 10000 + Number(min) * 100 + Number(mic));
                let tpl = fs.readFileSync("src/libxslt/xsltconfig.h.in", "utf8");
                const reps = {
                  "@VERSION@": ver,
                  "@LIBXSLT_VERSION_NUMBER@": num,
                  "@LIBXSLT_VERSION_EXTRA@": "",
                  "@WITH_XSLT_DEBUG@": "0",
                  "@WITH_TRIO@": "0",
                  "@WITH_DEBUGGER@": "0",
                  "@WITH_PROFILER@": "1",
                  "@WITH_MODULES@": "0",
                  "@LIBXSLT_DEFAULT_PLUGINS_PATH@": "/usr/lib/libxslt-plugins"
                };
                for (const [k, v] of Object.entries(reps)) tpl = tpl.replaceAll(k, v);
                fs.writeFileSync("/tmp/xslt_inc/libxslt/xsltconfig.h", tpl);
              '
              cat > /tmp/xslt_inc/config.h <<'EOF'
          #define HAVE_INTTYPES_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_SNPRINTF 1
          #define HAVE_VSNPRINTF 1
          #define HAVE_STAT 1
          #define XML_SYSCONFDIR "/etc"
          #ifndef _WIN32
          #define HAVE_UNISTD_H 1
          #define HAVE_GETTIMEOFDAY 1
          #define HAVE_GMTIME_R 1
          #define HAVE_LOCALTIME_R 1
          #define HAVE_SYS_SELECT_H 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TIME_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_LOCALE_H 1
          #else
          #define HAVE__STAT 1
          #define HAVE_SYS_TIMEB_H 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_LOCALE_H 1
          #endif
          EOF
              XSLT_SRCS="src/libxslt/attributes.c src/libxslt/attrvt.c src/libxslt/documents.c src/libxslt/extensions.c src/libxslt/extra.c src/libxslt/functions.c src/libxslt/imports.c src/libxslt/keys.c src/libxslt/namespaces.c src/libxslt/numbers.c src/libxslt/pattern.c src/libxslt/preproc.c src/libxslt/security.c src/libxslt/templates.c src/libxslt/transform.c src/libxslt/variables.c src/libxslt/xslt.c src/libxslt/xsltlocale.c src/libxslt/xsltutils.c"
              XSLT_FLAGS="-I/tmp/xslt_inc -Isrc -I/tmp/xml_inc -I/tmp/libxml2_src/include -DHAVE_CONFIG_H"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $XSLT_FLAGS -DIN_LIBXSLT $XSLT_SRCS /tmp/xml2_dist/libxml2-win64.dll.a -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XSLT_FLAGS $XSLT_SRCS /tmp/xml2_dist/libxml2-linux-x64.so "-Wl,-rpath,\$ORIGIN" -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $XSLT_FLAGS $XSLT_SRCS /tmp/xml2_dist/libxml2-linux-arm64.so "-Wl,-rpath,\$ORIGIN" -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $XSLT_FLAGS $XSLT_SRCS -lm -Wl,-undefined,dynamic_lookup -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $XSLT_FLAGS -I/tmp/libxml2_src "-Ddup(x)=(x)" $XSLT_SRCS $XML2_TMP_SRCS -lm -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              DL_LD_LIBRARY_PATH="/tmp/xml2_dist"
              ;;

            woff2)
              clone_tag
              git clone --depth=1 https://github.com/google/brotli.git /tmp/brotli_src
              WOFF_SRCS="src/src/table_tags.cc src/src/variable_length.cc src/src/woff2_common.cc src/src/woff2_dec.cc src/src/woff2_out.cc src/src/font.cc src/src/glyph.cc src/src/normalize.cc src/src/transform.cc src/src/woff2_enc.cc"
              BROTLI_SRCS=$(find /tmp/brotli_src/c/common /tmp/brotli_src/c/dec /tmp/brotli_src/c/enc -maxdepth 1 -name '*.c' | sort)
              WOFF_FLAGS="-D__STDC_FORMAT_MACROS -Isrc/include -Isrc/src -I/tmp/brotli_src/c/include -I/tmp/brotli_src/c"
              zig c++ -target x86_64-windows-gnu -O2 -shared -s -Wl,--export-all-symbols $DET_FLAGS $WOFF_FLAGS $WOFF_SRCS $BROTLI_SRCS -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig c++ -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $WOFF_FLAGS $WOFF_SRCS $BROTLI_SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig c++ -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $WOFF_FLAGS $WOFF_SRCS $BROTLI_SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              zig c++ -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $WOFF_FLAGS -DOS_MACOSX $WOFF_SRCS $BROTLI_SRCS -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig c++ -target wasm32-wasi        -O2 -mexec-model=reactor -fno-exceptions $DET_FLAGS $WOFF_FLAGS $WOFF_SRCS $BROTLI_SRCS -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            libarchive)
              clone_tag
              mkdir -p /tmp/arc_inc
              sed -i '/#  define ARCHIVE_CRYPTOR_USE_Apple_CommonCrypto 1/d' src/libarchive/archive_cryptor_private.h
              sed -i '/#  define ARCHIVE_HMAC_USE_Apple_CommonCrypto/d' src/libarchive/archive_hmac_private.h
              cat > /tmp/arc_inc/config.h <<'EOF'
          #ifndef LIBARCHIVE_CONFIG_H
          #define LIBARCHIVE_CONFIG_H
          #define __LIBARCHIVE_CONFIG_H_INCLUDED 1
          #define HAVE_CTYPE_H 1
          #define HAVE_ERRNO_H 1
          #define HAVE_FCNTL_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_LIMITS_H 1
          #define HAVE_STDARG_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_STDLIB_H 1
