name: Ghost Build Stacks — Hermetic Content-Addressed Toolchains for holo-compiler

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for Ghost Toolchain Packs'
        required: true
        default: 'v0.1.0-ghost-toolchains'

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.1.0-ghost-toolchains' }}
        run: |
          gh release view "$TAG" --repo awesome-os/upstream-mirrors >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/upstream-mirrors \
              --title "Ghost Build Stacks (${TAG}) — Hermetic Toolchains for holo-compiler" \
              --notes "Content-addressed, tree-shaken Ghost Build Stacks (Zig 0.14.0 4-OS cross-compiler + hermetic WinSDK/CRT via xwin + standalone Ninja/GN legacy bridges) with unified \`ghost-toolchains-manifest.json\` so \`holo-compiler\` never depends on stale runner SDKs or ambient host compilers."

  pack-ghost-toolchains:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [zig-0.14.0, ninja-1.12.1, xwin-winsdk, llvm-23.1.6-ir]
    steps:
      - name: Build Hermetic Ghost Stack (${{ matrix.stack }})
        env:
          STACK: ${{ matrix.stack }}
        run: |
          mkdir -p dist /tmp/work

          if [ "$STACK" = "zig-0.14.0" ]; then
            curl -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o dist/ghost-zig-0.14.0-linux-x64.tar.xz
            curl -fsSL https://ziglang.org/download/0.14.0/zig-windows-x86_64-0.14.0.zip -o dist/ghost-zig-0.14.0-win64.zip
            curl -fsSL https://ziglang.org/download/0.14.0/zig-macos-aarch64-0.14.0.tar.xz -o dist/ghost-zig-0.14.0-macos-arm64.tar.xz
          elif [ "$STACK" = "ninja-1.12.1" ]; then
            curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip -o dist/ghost-ninja-1.12.1-linux-x64.zip
            curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip -o dist/ghost-ninja-1.12.1-win64.zip
            curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip -o dist/ghost-ninja-1.12.1-macos.zip
          elif [ "$STACK" = "xwin-winsdk" ]; then
            curl -fsSL https://github.com/Jake-Shadle/xwin/releases/download/0.10.0/xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp/work
            XWIN=/tmp/work/xwin-0.10.0-x86_64-unknown-linux-musl/xwin
            "$XWIN" --accept-license --arch x86_64 splat --output /tmp/work/winsdk-x64 --preserve-ms-arch-notation
            tar -I 'zstd -T0 -9' -cf dist/ghost-winsdk-msvc-x64.tar.zst -C /tmp/work/winsdk-x64 .
          elif [ "$STACK" = "llvm-23.1.6-ir" ]; then
            # Full Clang + LLD + WASM + LLVM IR stack (strips only lldb/flang/mlir/polly/static .a bloat)
            mkdir -p /tmp/work/llvm-lin /tmp/work/llvm-lin-slim/bin /tmp/work/llvm-lin-slim/lib
            curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/LLVM-23.1.6-Linux-X64.tar.zst | tar --zstd -xf - -C /tmp/work/llvm-lin --strip-components=1
            for pat in 'clang*' 'lld*' 'ld.lld*' 'ld64.lld*' 'wasm-ld*' 'opt*' 'llc*' 'lli*' 'llvm-*'; do
              cp -a /tmp/work/llvm-lin/bin/$pat /tmp/work/llvm-lin-slim/bin/ 2>/dev/null || true
            done
            cp -a /tmp/work/llvm-lin/lib/clang /tmp/work/llvm-lin-slim/lib/ 2>/dev/null || true
            cp -a /tmp/work/llvm-lin/lib/libLLVM*.so* /tmp/work/llvm-lin/lib/libclang*.so* /tmp/work/llvm-lin/lib/libLTO*.so* /tmp/work/llvm-lin-slim/lib/ 2>/dev/null || true
            tar -I 'zstd -T0 -9' -cf dist/ghost-llvm-23.1.6-full-linux-x64.tar.zst -C /tmp/work/llvm-lin-slim .
            rm -rf /tmp/work/llvm-lin /tmp/work/llvm-lin-slim

            mkdir -p /tmp/work/llvm-win /tmp/work/llvm-win-slim/bin /tmp/work/llvm-win-slim/lib
            curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/clang+llvm-23.1.6-x86_64-pc-windows-msvc.tar.zst | tar --zstd -xf - -C /tmp/work/llvm-win --strip-components=1
            for pat in 'clang*' 'lld*' 'ld.lld*' 'ld64.lld*' 'wasm-ld*' 'opt*' 'llc*' 'lli*' 'llvm-*' '*.dll'; do
              cp -a /tmp/work/llvm-win/bin/$pat /tmp/work/llvm-win-slim/bin/ 2>/dev/null || true
            done
            cp -a /tmp/work/llvm-win/lib/clang /tmp/work/llvm-win-slim/lib/ 2>/dev/null || true
            tar -I 'zstd -T0 -9' -cf dist/ghost-llvm-23.1.6-full-win64.tar.zst -C /tmp/work/llvm-win-slim .
            rm -rf /tmp/work/llvm-win /tmp/work/llvm-win-slim
          fi

          (cd dist && sha256sum * > "SHA256SUMS-toolchain-${STACK}.txt")
          ls -lh dist/

      - name: Upload Ghost Stack to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.1.0-ghost-toolchains' }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

  emit-toolchain-manifest:
    needs: pack-ghost-toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Emit Unified ghost-toolchains-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.1.0-ghost-toolchains' }}
        run: |
          mkdir -p /tmp/sums
          gh release download "$TAG" --repo awesome-os/upstream-mirrors --pattern "SHA256SUMS-toolchain-*.txt" --dir /tmp/sums --clobber
          node -e "
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;
            const stacks = [];
            for (const f of fs.readdirSync('/tmp/sums').sort()) {
              for (const line of fs.readFileSync(path.join('/tmp/sums', f), 'utf8').trim().split('\n')) {
                const [sha256, filename] = line.trim().split(/\s+/);
                if (!sha256 || !filename) continue;
                stacks.push({
                  id: filename.replace(/\.(tar\.(xz|zst|gz)|zip)$/, ''),
                  filename,
                  sha256,
                  cas_key: sha256.slice(0, 16),
                  download_url: 'https://github.com/awesome-os/upstream-mirrors/releases/download/' + tag + '/' + filename
                });
              }
            }
            const manifest = {
              schema: 'b8g-ghost-toolchains-v1',
              tag,
              purpose: 'Hermetic content-addressed Ghost Build Stacks for holo-compiler (zero ambient runner SDK drift)',
              total_packs: stacks.length,
              toolchains: stacks
            };
            fs.writeFileSync('/tmp/ghost-toolchains-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('[ghost-toolchains] Published manifest with', stacks.length, 'hermetic toolchain packs');
          "
          gh release upload "$TAG" /tmp/ghost-toolchains-manifest.json --repo awesome-os/upstream-mirrors --clobber
