name: Holo 5-OS Max Shards — Pure Zig 0.14.0 Tier-1 Production Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS max-version shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
  schedule:
    - cron: '0 6 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-max-shards.yml'
      - '.github/workflows/holo-5os-max-shards.mts'

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Ensure GitHub Release & Resolve Live Pinned Max Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: node .github/workflows/holo-5os-max-shards.mts resolve

      - uses: actions/upload-artifact@v7
        with:
          name: resolved-versions
          path: resolved-versions.json

  build-max-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - zlib
          - zstd
          - libdeflate
          - lz4
          - brotli
          - md4c
          - sqlite3
          - simdjson
          - simdutf
          - ada
          - libyaml
          - libwebp
          - expat
          - mimalloc
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Compile ${{ matrix.lib }} (Max Version) for 5 OS Targets via Pure Zig 0.14.0
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/holo-5os-max-shards.mts build

      - name: Upload Max 5-OS Shard Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

  emit-v11-max-5os-manifest:
    needs: [ensure-release, build-max-5os-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/

      - uses: actions/download-artifact@v8
        with:
          name: resolved-versions
          path: /tmp/meta

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Emit Combined SHA512SUMS.txt & holo-v11-max-5os-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: node .github/workflows/holo-5os-max-shards.mts finalize
