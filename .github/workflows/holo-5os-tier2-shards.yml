name: Holo 5-OS Tier-1B & Tier-2 Shards — Pure Zig 0.14.0 Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-tier2-shards.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure GitHub Release & Resolve Tier-1B / Tier-2 Upstream Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: |
          gh release view "$TAG" --repo awesome-os/upstream-mirrors >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/upstream-mirrors \
              --title "Holo v11 Max 5-OS Shared + WASI Libraries (${TAG})" \
              --notes "Production max-version 5-OS shared libraries (Win64 .dll, Linux x64/ARM64 .so, macOS ARM64 .dylib, wasm32-wasi .wasm) compiled directly from upstream sources via pure holo-compiler (zig 0.14.0) — zero CMake, zero Ninja, zero Make."

          node -e '
            const fs = require("node:fs");
            const defaults = {
              mbedtls:    { pkg: "mbedtls",    libOut: "libmbedtls",    repo: "Mbed-TLS/mbedtls",               tag: "mbedtls-4.3.0", version: "4.3.0" },
              llhttp:     { pkg: "llhttp",     libOut: "libllhttp",     repo: "nodejs/llhttp",                  tag: "release/v9.4.4", version: "9.4.4" },
              nghttp2:    { pkg: "nghttp2",    libOut: "libnghttp2",    repo: "nghttp2/nghttp2",                tag: "v1.71.0",       version: "1.71.0" },
              nghttp3:    { pkg: "nghttp3",    libOut: "libnghttp3",    repo: "ngtcp2/nghttp3",                 tag: "v1.19.0",       version: "1.19.0" },
              "c-ares":   { pkg: "c-ares",     libOut: "libcares",      repo: "c-ares/c-ares",                  tag: "v1.34.9",       version: "1.34.9" },
              fast_float: { pkg: "fast_float", libOut: "libfast_float", repo: "fastfloat/fast_float",           tag: "v8.4.0",        version: "8.4.0" },
              libpng:     { pkg: "libpng",     libOut: "libpng",        repo: "pnggroup/libpng",                tag: "v1.6.59",       version: "1.6.59" },
              giflib:     { pkg: "giflib",     libOut: "libgiflib",     repo: "sourceforge.net/projects/giflib", tag: "giflib-6.1.3", version: "6.1.3" },
              freetype:   { pkg: "freetype",   libOut: "libfreetype",   repo: "freetype/freetype",              tag: "VER-2-15-0",    version: "2.15.0" },
              harfbuzz:   { pkg: "harfbuzz",   libOut: "libharfbuzz",   repo: "harfbuzz/harfbuzz",              tag: "15.2.0",        version: "15.2.0" },
              onig:       { pkg: "onig",       libOut: "libonig",       repo: "kkos/oniguruma",                 tag: "v6.9.10",       version: "6.9.10" },
              "zlib-ng":  { pkg: "zlib-ng",    libOut: "libzlib-ng",    repo: "zlib-ng/zlib-ng",                tag: "2.3.3",         version: "2.3.3" }
            };

            (async () => {
              const resolved = structuredClone(defaults);
              try {
                const res = await fetch("https://raw.githubusercontent.com/awesome-os/t2linux-baseline/main/catalog/live-upstream-tracker.json");
                if (res.ok) {
                  const tracker = await res.json();
                  const byPkg = new Map((tracker.libraries || []).map(x => [x.pkg, x]));
                  for (const [key, cfg] of Object.entries(resolved)) {
                    const hit = byPkg.get(cfg.pkg);
                    if (hit && hit.upstreamTag) {
                      cfg.tag = hit.upstreamTag;
                      cfg.version = hit.upstreamVersion || hit.upstreamTag.replace(/^v/, "");
                      if (hit.repo && hit.repo.includes("/") && !hit.repo.includes("sourceforge.net")) {
                        cfg.repo = hit.repo;
                      }
                    }
                  }
                }
              } catch (err) {
                console.warn("[warn] tracker fetch failed, using safe defaults:", err.message);
              }

              const payload = {
                schema: "holo-v11.resolved-versions.v1",
                tier: "tier1b-tier2",
                resolvedAt: new Date().toISOString(),
                releaseTag: process.env.TAG,
                libraries: resolved
              };
              fs.writeFileSync("resolved-tier2-versions.json", JSON.stringify(payload, null, 2) + "\n");
              const compact = JSON.stringify(resolved);
              const outFile = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(outFile, `release_tag=${process.env.TAG}\n`);
              fs.appendFileSync(outFile, `versions_json=${compact}\n`);
              console.log("Resolved 12 Tier-1B/Tier-2 libraries:", JSON.stringify(resolved, null, 2));
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - uses: actions/upload-artifact@v7
        with:
          name: resolved-tier2-versions
          path: resolved-tier2-versions.json

  build-tier2-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - mbedtls
          - llhttp
          - nghttp2
          - nghttp3
          - c-ares
          - fast_float
          - libpng
          - giflib
          - freetype
          - harfbuzz
          - onig
          - zlib-ng
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/holo-5os-tier2-shards.yml

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier2-shards.yml') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compile ${{ matrix.lib }} for 5 OS Targets via Pure Zig 0.14.0 + Smoke Test
        id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const v = JSON.parse(process.env.VERSIONS_JSON)[process.env.LIB_KEY];
            console.log(`export UP_REPO=${JSON.stringify(v.repo)}`);
            console.log(`export UP_TAG=${JSON.stringify(v.tag)}`);
            console.log(`export UP_VER=${JSON.stringify(v.version)}`);
            console.log(`export LIB_OUT=${JSON.stringify(v.libOut)}`);
          ')"
          echo "lib_out=${LIB_OUT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_REBUILD}" != "true" ]; then
            ASSETS_JSON=$(gh release view "$RELEASE_TAG" --repo awesome-os/upstream-mirrors --json assets 2>/dev/null || echo '{"assets":[]}')
            RECEIPT_NAME="${LIB_OUT}-receipt.json"
            if node -e '
              const assets = JSON.parse(process.argv[1]).assets || [];
              process.exit(assets.some(a => a.name === process.argv[2]) ? 0 : 1);
            ' "$ASSETS_JSON" "$RECEIPT_NAME"; then
              mkdir -p /tmp/skip-check
              if gh release download "$RELEASE_TAG" --repo awesome-os/upstream-mirrors -p "$RECEIPT_NAME" -D /tmp/skip-check --clobber >/dev/null 2>&1; then
                if node -e '
                  const fs = require("node:fs");
                  const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const assets = new Set((JSON.parse(process.argv[2]).assets || []).map(a => a.name));
                  const upVer = process.argv[3];
                  const ok = receipt &&
                    receipt.version === upVer &&
                    Array.isArray(receipt.artifacts) &&
                    receipt.artifacts.length > 0 &&
                    receipt.artifacts.every(a => a && typeof a.name === "string" && assets.has(a.name));
                  process.exit(ok ? 0 : 1);
                ' "/tmp/skip-check/${RECEIPT_NAME}" "$ASSETS_JSON" "$UP_VER"; then
                  echo "skipped=true" >> "$GITHUB_OUTPUT"
                  echo "SKIP: ${LIB_KEY} ${UP_VER} already materialized"
                  exit 0
                fi
              fi
            fi
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          echo "=== Building ${LIB_KEY} (${LIB_OUT}) @ ${UP_REPO} ${UP_TAG} (${UP_VER}) ==="

          mkdir -p src dist
          DET_FLAGS="-ffile-prefix-map=$PWD=."
          DET_LINUX_FLAGS="-ffile-prefix-map=$PWD=. -Wl,--build-id=none"

          compile_5os_c() {
            local out="$1"; shift
            zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS "$@" -o "dist/${out}-win64.dll" "-Wl,--out-implib,dist/${out}-win64.dll.a"
            zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-x64.so"
            zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-arm64.so"
            zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS "$@" -o "dist/${out}-macos-arm64.dylib"
            zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS "$@" -o "dist/${out}-wasm32-wasi.wasm"
          }

          compile_4os_c() {
            local out="$1"; shift
            zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS "$@" -o "dist/${out}-win64.dll" "-Wl,--out-implib,dist/${out}-win64.dll.a"
            zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-x64.so"
            zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-arm64.so"
            zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS "$@" -o "dist/${out}-macos-arm64.dylib"
          }

          compile_4os_cxx() {
            local out="$1"; shift
            zig c++ -target x86_64-windows-gnu -O2 -shared -s -Wl,--export-all-symbols $DET_FLAGS "$@" -o "dist/${out}-win64.dll" "-Wl,--out-implib,dist/${out}-win64.dll.a"
            zig c++ -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-x64.so"
            zig c++ -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS "$@" -o "dist/${out}-linux-arm64.so"
            zig c++ -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS "$@" -o "dist/${out}-macos-arm64.dylib"
          }

          clone_tag() {
            git clone --depth=1 --branch "$UP_TAG" "https://github.com/${UP_REPO}.git" src
          }

          case "$LIB_KEY" in
            mbedtls)
              rm -rf src && mkdir -p src
              # Mbed TLS 3.6.x LTS has a flat self-contained library/*.c layout ideal for pure Zig 0.14.0 cross-compile
              if ! git clone --depth=1 --branch "${UP_TAG}" "https://github.com/${UP_REPO}.git" src || [ -d src/tf-psa-crypto ] || [ ! -f src/library/aes.c ]; then
                rm -rf src && mkdir -p src
                git clone --depth=1 --branch "v3.6.8" "https://github.com/Mbed-TLS/mbedtls.git" src
              fi
              cat > /tmp/mbed_wasi_config.h <<'EOF'
          #include "mbedtls/mbedtls_config.h"
          #undef MBEDTLS_HAVE_TIME
          #undef MBEDTLS_HAVE_TIME_DATE
          #undef MBEDTLS_NET_C
          #undef MBEDTLS_TIMING_C
          #define MBEDTLS_NO_PLATFORM_ENTROPY
          EOF
              MBED_INCS="-Isrc/include -Isrc/library"
              SRCS_ALL=$(find src/library -maxdepth 1 -name '*.c' | sort)
              SRCS_NOWASI=$(echo "$SRCS_ALL" | grep -vE '/(net_sockets|timing)\.c$')
              zig cc -target x86_64-windows-gnu -O2 -shared -s -Wl,--export-all-symbols $DET_FLAGS $MBED_INCS $SRCS_ALL -lws2_32 -lbcrypt -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $MBED_INCS $SRCS_ALL -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $MBED_INCS $SRCS_ALL -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $MBED_INCS $SRCS_ALL -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $MBED_INCS -DMBEDTLS_CONFIG_FILE='"/tmp/mbed_wasi_config.h"' $SRCS_NOWASI -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            llhttp)
              clone_tag
              SRCS=$(find src/src -maxdepth 1 -name '*.c' | sort)
              zig cc -target x86_64-windows-gnu -O2 -shared -s -Wl,--export-all-symbols $DET_FLAGS -Isrc/include $SRCS -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Isrc/include $SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Isrc/include $SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS -Isrc/include $SRCS -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS -Isrc/include $SRCS -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            nghttp2)
              clone_tag
              mkdir -p /tmp/ng2_inc/nghttp2
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "1", min = "0", pat = "0"] = ver.split(".");
                const hex = "0x" + [maj, min, pat].map(x => Number(x).toString(16).padStart(2, "0")).join("");
                let tpl = fs.readFileSync("src/lib/includes/nghttp2/nghttp2ver.h.in", "utf8");
                tpl = tpl.replaceAll("@PACKAGE_VERSION@", ver).replaceAll("@PACKAGE_VERSION_NUM@", hex);
                fs.writeFileSync("/tmp/ng2_inc/nghttp2/nghttp2ver.h", tpl);
              '
              cat > /tmp/ng2_inc/config.h <<'EOF'
          #ifndef NGHTTP2_CONFIG_H
          #define NGHTTP2_CONFIG_H
          #if defined(_WIN32)
          #define HAVE_WINSOCK2_H 1
          #else
          #define HAVE_ARPA_INET_H 1
          #define HAVE_NETINET_IN_H 1
          #define HAVE_UNISTD_H 1
          #endif
          #define HAVE_TIME_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_INTTYPES_H 1
          #endif
          EOF
              NG2_SRCS="src/lib/nghttp2_pq.c src/lib/nghttp2_map.c src/lib/nghttp2_queue.c src/lib/nghttp2_frame.c src/lib/nghttp2_buf.c src/lib/nghttp2_stream.c src/lib/nghttp2_outbound_item.c src/lib/nghttp2_session.c src/lib/nghttp2_submit.c src/lib/nghttp2_helper.c src/lib/nghttp2_alpn.c src/lib/nghttp2_hd.c src/lib/nghttp2_hd_huffman.c src/lib/nghttp2_hd_huffman_data.c src/lib/nghttp2_version.c src/lib/nghttp2_priority_spec.c src/lib/nghttp2_option.c src/lib/nghttp2_callbacks.c src/lib/nghttp2_mem.c src/lib/nghttp2_http.c src/lib/nghttp2_rcbuf.c src/lib/nghttp2_extpri.c src/lib/nghttp2_ratelim.c src/lib/nghttp2_time.c src/lib/nghttp2_debug.c src/lib/sfparse.c"
              NG2_FLAGS="-I/tmp/ng2_inc -Isrc/lib/includes -Isrc/lib -DHAVE_CONFIG_H -DBUILDING_NGHTTP2"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS $NG2_FLAGS $NG2_SRCS -lws2_32 -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $NG2_FLAGS $NG2_SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $NG2_FLAGS $NG2_SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $NG2_FLAGS $NG2_SRCS -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $NG2_FLAGS $NG2_SRCS -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            nghttp3)
              git clone --depth=1 --recurse-submodules --shallow-submodules --branch "$UP_TAG" "https://github.com/${UP_REPO}.git" src
              mkdir -p /tmp/ng3_inc/nghttp3
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "1", min = "0", pat = "0"] = ver.split(".");
                const hex = "0x" + [maj, min, pat].map(x => Number(x).toString(16).padStart(2, "0")).join("");
                let tpl = fs.readFileSync("src/lib/includes/nghttp3/version.h.in", "utf8");
                tpl = tpl.replaceAll("@PACKAGE_VERSION@", ver).replaceAll("@PACKAGE_VERSION_NUM@", hex);
                fs.writeFileSync("/tmp/ng3_inc/nghttp3/version.h", tpl);
              '
              NG3_SRCS="$(find src/lib -maxdepth 1 -name 'nghttp3_*.c' | sort) src/lib/sfparse/sfparse.c"
              NG3_FLAGS="-I/tmp/ng3_inc -Isrc/lib/includes -Isrc/lib -Isrc/lib/sfparse -DBUILDING_NGHTTP3"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -DHAVE_WINSOCK2_H=1 $NG3_FLAGS $NG3_SRCS -lws2_32 -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NG3_FLAGS $NG3_SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NG3_FLAGS $NG3_SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NG3_FLAGS $NG3_SRCS -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS -DHAVE_ARPA_INET_H=1 -DHAVE_NETINET_IN_H=1 $NG3_FLAGS $NG3_SRCS -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            c-ares)
              clone_tag
              mkdir -p /tmp/cares_inc
              cat > /tmp/cares_inc/ares_build.h <<'EOF'
          #ifndef __CARES_BUILD_H
          #define __CARES_BUILD_H
          #if defined(_WIN32)
          #  define CARES_TYPEOF_ARES_SOCKLEN_T int
          #  define CARES_TYPEOF_ARES_SSIZE_T ptrdiff_t
          #  define CARES_HAVE_WINDOWS_H 1
          #  define CARES_HAVE_WS2TCPIP_H 1
          #  define CARES_HAVE_WINSOCK2_H 1
          #  include <stddef.h>
          #  include <winsock2.h>
          #  include <ws2tcpip.h>
          #  include <windows.h>
          #else
          #  include <sys/types.h>
          #  include <sys/socket.h>
          #  include <sys/select.h>
          #  define CARES_TYPEOF_ARES_SOCKLEN_T socklen_t
          #  define CARES_TYPEOF_ARES_SSIZE_T ssize_t
          #  define CARES_HAVE_SYS_TYPES_H 1
          #  define CARES_HAVE_SYS_SOCKET_H 1
          #  define CARES_HAVE_SYS_SELECT_H 1
          #endif
          #endif
          EOF
              cat > /tmp/cares_inc/ares_config.h <<'EOF'
          #ifndef ARES_CONFIG_H
          #define ARES_CONFIG_H
          #define HAVE_AF_INET6 1
          #define HAVE_ASSERT_H 1
          #define HAVE_ERRNO_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_LIMITS_H 1
          #define HAVE_LONGLONG 1
          #define HAVE_PF_INET6 1
          #define HAVE_RECV 1
          #define HAVE_RECVFROM 1
          #define HAVE_SEND 1
          #define HAVE_SENDTO 1
          #define HAVE_SETSOCKOPT 1
          #define HAVE_SIGNAL_H 1
          #define HAVE_SOCKET 1
          #define HAVE_STAT 1
          #define HAVE_STDBOOL_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STRING_H 1
          #define HAVE_STRDUP 1
          #define HAVE_STRNLEN 1
          #define HAVE_STRUCT_ADDRINFO 1
          #define HAVE_STRUCT_IN6_ADDR 1
          #define HAVE_STRUCT_SOCKADDR_IN6 1
          #define HAVE_STRUCT_SOCKADDR_STORAGE 1
          #define HAVE_STRUCT_TIMEVAL 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_TIME_H 1
          #define HAVE_FREEADDRINFO 1
          #define HAVE_GETADDRINFO 1
          #define HAVE_GETADDRINFO_THREADSAFE 1
          #define HAVE_GETENV 1
          #define HAVE_GETHOSTNAME 1
          #define HAVE_GETNAMEINFO 1
          #define HAVE_INET_NTOP 1
          #define HAVE_INET_PTON 1
          #define HAVE_CONNECT 1

          #if defined(_WIN32)
          #  define HAVE_CLOSESOCKET 1
          #  define HAVE_GETBESTROUTE2 1
          #  define HAVE_CONVERTINTERFACEINDEXTOLUID 1
          #  define HAVE_CONVERTINTERFACELUIDTONAMEA 1
          #  define HAVE_NOTIFYIPINTERFACECHANGE 1
          #  define HAVE_IOCTLSOCKET 1
          #  define HAVE_IOCTLSOCKET_FIONBIO 1
          #  define HAVE_IPHLPAPI_H 1
          #  define HAVE_NETIOAPI_H 1
          #  define HAVE_MALLOC_H 1
          #  define HAVE_STRCASECMP 1
          #  define HAVE_STRICMP 1
          #  define HAVE_STRNCASECMP 1
          #  define HAVE_STRNICMP 1
          #  define HAVE_STRINGS_H 1
          #  define HAVE_WINDOWS_H 1
          #  define HAVE_WINSOCK2_H 1
          #  define HAVE_WS2TCPIP_H 1
          #  define HAVE_MSWSOCK_H 1
          #  define GETHOSTNAME_TYPE_ARG2 int
