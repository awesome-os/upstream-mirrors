name: Holo 5-OS Shards — Zero-CMake / Zero-Ninja Pure Zig Cross-Compiler (Win64/Linux x64+ARM64/macOS/WASI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS zero-CMake shared + WASI libraries'
        required: true
        default: 'v0.2.0-holo-5os'

permissions:
  contents: write

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: false }
env: { GH_TOKEN: "${{ github.token }}" }

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - env: { TAG: "${{ inputs.release_tag || 'v0.2.0-holo-5os' }}" }
        run: node .github/workflows/holo-4os-shards.mts ensure-release

  build-4os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [brotli, expat, sqlite3, libwebp, lz4, md4c, picohttp]
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.14.0 }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - if: matrix.engine != 'sqlite3'
        uses: actions/checkout@v7
        with: { ref: "mirror/${{ matrix.engine }}", path: src }
      - env: { ENGINE: "${{ matrix.engine }}" }
        run: node .github/workflows/holo-4os-shards.mts build
      - env: { TAG: "${{ inputs.release_tag || 'v0.2.0-holo-5os' }}" }
        run: node .github/workflows/holo-workflow-runtime.mts upload

  emit-5os-holo-manifest:
    needs: build-4os-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/workflows/ }
      - uses: actions/setup-node@v7
        with: { node-version: '26' }
      - env: { TAG: "${{ inputs.release_tag || 'v0.2.0-holo-5os' }}" }
        run: node .github/workflows/holo-4os-shards.mts manifest
