name: Sync Sparse Debloated Upstream Mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  sync-sparse-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sparse-Clone & Commit Clean Stripped Trees to mirror/<name> Branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_sparse() {
            NAME="$1"
            URL="$2"
            UP_BRANCH="${3:-}"
            shift 2
            if [ $# -gt 0 ]; then shift; fi
            BRANCH="mirror/${NAME}"
            WORK="/tmp/mirror-${NAME}"
            rm -rf "$WORK"
            echo "=== Syncing sparse ${NAME} from ${URL} -> ${BRANCH} ==="
            if [ -n "$UP_BRANCH" ]; then
              git clone --depth=1 --filter=blob:none --no-checkout --branch "$UP_BRANCH" "$URL" "$WORK"
            else
              git clone --depth=1 --filter=blob:none --no-checkout "$URL" "$WORK"
            fi
            git -C "$WORK" sparse-checkout init --no-cone
            if [ $# -gt 0 ]; then
              : > "$WORK/.git/info/sparse-checkout"
              for p in "$@"; do
                echo "/${p#/}" >> "$WORK/.git/info/sparse-checkout"
              done
            else
              cat << 'EOF' > "$WORK/.git/info/sparse-checkout"
          /*
          !/test/
          !/tests/
          !/testing/
          !/fuzz/
          !/fuzzer/
          !/doc/
          !/docs/
          !/bench/
          !/benchmark/
          !/benchmarks/
          !/examples/
          !/java/
          !/python/
          !/go/
          !/rust/
          !/research/
          !/.github/
          EOF
            fi
            git -C "$WORK" checkout --quiet HEAD
            UP_SHA=$(git -C "$WORK" rev-parse --short HEAD)
            rm -rf "$WORK/.git"
            FILES=$(find "$WORK" -type f | wc -l)
            SIZE=$(du -sh "$WORK" | awk '{print $1}')

            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch --depth=1 origin "$BRANCH"
              git checkout -B "$BRANCH" FETCH_HEAD
            else
              git checkout --orphan "$BRANCH"
            fi
            git rm -rf . >/dev/null 2>&1 || true
            cp -a "$WORK"/. .
            git add -A
            if git diff --cached --quiet; then
              echo "  -> ${BRANCH} @ ${UP_SHA} unchanged (0 new commits)"
            else
              git commit -q -m "mirror(${NAME}): sparse stripped snapshot @ ${UP_SHA} (${FILES} files, ${SIZE})"
              git push origin "$BRANCH"
              echo "  -> Appended commit on ${BRANCH} @ ${UP_SHA} (${FILES} files, ${SIZE})"
            fi
            echo "{\"name\":\"${NAME}\",\"branch\":\"${BRANCH}\",\"upstream_url\":\"${URL}\",\"upstream_sha\":\"${UP_SHA}\",\"files\":${FILES},\"size\":\"${SIZE}\"}" >> /tmp/mirror-rows.jsonl
            git checkout -f main
            git clean -fdx
          }

          rm -f /tmp/mirror-rows.jsonl
          sync_sparse boringssl     https://boringssl.googlesource.com/boringssl
          sync_sparse brotli        https://github.com/google/brotli.git
          sync_sparse libwebp       https://chromium.googlesource.com/webm/libwebp
          sync_sparse zlib-ng       https://github.com/zlib-ng/zlib-ng.git
          sync_sparse libpng        https://github.com/pnggroup/libpng.git
          sync_sparse freetype      https://gitlab.freedesktop.org/freetype/freetype.git
          sync_sparse harfbuzz      https://github.com/harfbuzz/harfbuzz.git
          sync_sparse libjpeg-turbo https://github.com/libjpeg-turbo/libjpeg-turbo.git
          sync_sparse expat         https://github.com/libexpat/libexpat.git
          # Adopted from awesome-os/lo (lo/lib/*) — version-tracked sparse mirrors
          sync_sparse lz4           https://github.com/lz4/lz4.git
          sync_sparse libdeflate    https://github.com/ebiggers/libdeflate.git
          sync_sparse md4c          https://github.com/mity/md4c.git
          sync_sparse picohttp      https://github.com/h2o/picohttpparser.git
          sync_sparse libffi        https://github.com/libffi/libffi.git
          sync_sparse mbedtls       https://github.com/Mbed-TLS/mbedtls.git
          sync_sparse curl          https://github.com/curl/curl.git
          sync_sparse luajit        https://github.com/LuaJIT/LuaJIT.git
          sync_sparse raylib        https://github.com/raysan5/raylib.git
          sync_sparse tcc           https://github.com/TinyCC/tinycc.git
          sync_sparse ada           https://github.com/ada-url/ada.git
          sync_sparse simdutf       https://github.com/simdutf/simdutf.git
          # Mirror #22: Electron (Path 2 Electron-on-Sectium Shared-V8 component build)
          sync_sparse electron      https://github.com/electron/electron.git main lib/ docs/ typings/ build/args/ shell/common/api/ package.json LICENSE DEPS
          # Mirror #23: VS Code (MIT Code - OSS)
          sync_sparse vscode        https://github.com/microsoft/vscode.git main product.json package.json LICENSE.txt build/lib/ src/vs/code/ src/vs/platform/telemetry/
          # Mirror #24: Eclipse Theia
          sync_sparse theia         https://github.com/eclipse-theia/theia.git master package.json LICENSE packages/core/package.json packages/electron/ examples/browser/ examples/electron/
          # Mirror #25: Brave adblock-rust (MPL-2.0 Shields ad-blocker engine)
          sync_sparse adblock-rust  https://github.com/brave/adblock-rust.git master Cargo.toml LICENSE src/
          # Mirror #26: AFK-surf/xnulinux (XNU as a loadable kernel module for ARM64 Linux 7.0+ / t2xnu)
          sync_sparse xnulinux      https://github.com/AFK-surf/xnulinux.git main README.md Makefile fki/ scripts/

          node -e "
            const fs = require('fs');
            const rows = fs.readFileSync('/tmp/mirror-rows.jsonl', 'utf8').trim().split('\n').map(l => JSON.parse(l));
            fs.writeFileSync('mirror-index.json', JSON.stringify({ schema: 'awesome-os-sparse-mirrors-v1', updated_at: new Date().toISOString(), mirrors: rows }, null, 2) + '\n');
          "
          cat mirror-index.json
          MIRROR_COUNT=$(wc -l < /tmp/mirror-rows.jsonl | tr -d ' ')
          git add mirror-index.json
          git diff --cached --quiet || (git commit -m "chore: update mirror-index.json for ${MIRROR_COUNT} sparse upstream mirrors" && git push origin main)
