name: Sync Sparse Debloated Upstream Mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  sync-sparse-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Sparse-Clone & Commit Clean Stripped Trees to mirror/<name> Branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/sync-sparse-mirrors.mts
