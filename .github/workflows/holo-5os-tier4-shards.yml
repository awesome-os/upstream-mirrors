              }
              build_ssl_arch "mingw64" "x86_64-windows-gnu"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -Wl,--export-all-symbols -Wl,--whole-archive /tmp/ssl_mingw64/libcrypto.a -Wl,--no-whole-archive -lws2_32 -lcrypt32 -lbcrypt -o "dist/libcrypto-win64.dll" "-Wl,--out-implib,dist/libcrypto-win64.dll.a"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -Wl,--export-all-symbols -Wl,--whole-archive /tmp/ssl_mingw64/libssl.a -Wl,--no-whole-archive "dist/libcrypto-win64.dll.a" -lws2_32 -lcrypt32 -lbcrypt -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"

              build_ssl_arch "linux-x86_64" "x86_64-linux-gnu"
              zig cc -target x86_64-linux-gnu -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Wl,-soname,libcrypto-linux-x64.so -Wl,--whole-archive /tmp/ssl_linux-x86_64/libcrypto.a -Wl,--no-whole-archive -ldl -lpthread -o "dist/libcrypto-linux-x64.so"
              zig cc -target x86_64-linux-gnu -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Wl,-soname,libssl-linux-x64.so "-Wl,-rpath,\$ORIGIN" -Wl,--whole-archive /tmp/ssl_linux-x86_64/libssl.a -Wl,--no-whole-archive "dist/libcrypto-linux-x64.so" -ldl -lpthread -o "dist/${LIB_OUT}-linux-x64.so"

              build_ssl_arch "linux-aarch64" "aarch64-linux-gnu"
              zig cc -target aarch64-linux-gnu -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Wl,-soname,libcrypto-linux-arm64.so -Wl,--whole-archive /tmp/ssl_linux-aarch64/libcrypto.a -Wl,--no-whole-archive -ldl -lpthread -o "dist/libcrypto-linux-arm64.so"
              zig cc -target aarch64-linux-gnu -O2 -shared -fPIC -s $DET_LINUX_FLAGS -Wl,-soname,libssl-linux-arm64.so "-Wl,-rpath,\$ORIGIN" -Wl,--whole-archive /tmp/ssl_linux-aarch64/libssl.a -Wl,--no-whole-archive "dist/libcrypto-linux-arm64.so" -ldl -lpthread -o "dist/${LIB_OUT}-linux-arm64.so"
              DL_LD_LIBRARY_PATH="$PWD/dist"
              ;;

            limine)
              clone_tag
              mkdir -p /tmp/limine_src
              node -e '
                const fs = require("node:fs");
                let c = fs.readFileSync("src/host/limine.c", "utf8");
                c = c
                  .replaceAll("%VERSION%", process.env.UP_VER)
                  .replaceAll("%COPYRIGHT%", "Copyright (C) 2019-2026 Mintsuki and contributors.");
                fs.writeFileSync("/tmp/limine_src/limine.c", c);
              '
              LIM_FLAGS="-std=c99 -D_FILE_OFFSET_BITS=64 -DLIMINE_NO_BIOS"
              zig cc -target x86_64-windows-gnu -O2 -s $DET_FLAGS $LIM_FLAGS /tmp/limine_src/limine.c -o "dist/${LIB_OUT}-win64.exe"
              zig cc -target x86_64-linux-gnu   -O2 -s $DET_LINUX_FLAGS $LIM_FLAGS /tmp/limine_src/limine.c -o "dist/${LIB_OUT}-linux-x64"
              zig cc -target aarch64-linux-gnu  -O2 -s $DET_LINUX_FLAGS $LIM_FLAGS /tmp/limine_src/limine.c -o "dist/${LIB_OUT}-linux-arm64"
              zig cc -target aarch64-macos      -O2 $DET_FLAGS $LIM_FLAGS /tmp/limine_src/limine.c -o "dist/${LIB_OUT}-macos-arm64"
              ;;

            vulkan-loader)
              clone_tag
              if ! git clone --depth=1 --branch "$UP_TAG" "https://github.com/KhronosGroup/Vulkan-Headers.git" /tmp/vk_headers; then
                rm -rf /tmp/vk_headers && git clone --depth=1 "https://github.com/KhronosGroup/Vulkan-Headers.git" /tmp/vk_headers
              fi
              mkdir -p /tmp/vk_inc /tmp/vk_cf/CoreFoundation
              cat > /tmp/vk_inc/vk_cfg.h <<'EOF'
          #define VK_ENABLE_BETA_EXTENSIONS 1
          #define FALLBACK_CONFIG_DIRS "/etc/xdg"
          #define FALLBACK_DATA_DIRS "/usr/local/share:/usr/share"
          #define SYSCONFDIR "/etc"
          #define LOADER_ENABLE_LINUX_SORT 1
          EOF
              cat > /tmp/vk_cf/CoreFoundation/CoreFoundation.h <<'EOF'
          #ifndef _CF_STUB_H
          #define _CF_STUB_H
          #include <stdint.h>
          typedef const void *CFTypeRef;
          typedef const struct __CFBundle *CFBundleRef;
          typedef const struct __CFURL *CFURLRef;
          typedef unsigned char Boolean;
          typedef uint8_t UInt8;
          typedef long CFIndex;
          #ifndef TRUE
          #define TRUE 1
          #endif
          CFBundleRef CFBundleGetMainBundle(void);
          CFURLRef CFBundleCopyResourcesDirectoryURL(CFBundleRef bundle);
          Boolean CFURLGetFileSystemRepresentation(CFURLRef url, Boolean resolveAgainstBase, UInt8 *buffer, CFIndex maxBufLen);
          void CFRelease(CFTypeRef cf);
          #endif
          EOF
              VK_GEN="src/loader/generated/vk_loader_core_trampolines.c src/loader/generated/vk_loader_wsi.c"
              VK_COMMON=$(find src/loader -maxdepth 1 -name '*.c' \
                ! -name 'asm_offset.c' ! -name 'dlopen_fuchsia.c' ! -name 'dirent_on_windows.c' \
                ! -name 'loader_windows.c' ! -name 'loader_linux.c' ! -name 'dev_ext_trampoline.c' ! -name 'phys_dev_ext.c' | sort)
              VK_INC="-I/tmp/vk_headers/include -Isrc/loader -Isrc/loader/generated"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -DVK_ENABLE_BETA_EXTENSIONS -DVK_USE_PLATFORM_WIN32_KHR -DWIN32_LEAN_AND_MEAN $VK_INC $VK_COMMON src/loader/loader_windows.c src/loader/dirent_on_windows.c $VK_GEN src/loader/vulkan-1.def -lcfgmgr32 -ladvapi32 -lshlwapi -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS -D_GNU_SOURCE -include /tmp/vk_inc/vk_cfg.h $VK_INC $VK_COMMON src/loader/loader_linux.c $VK_GEN -ldl -lpthread -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS -D_GNU_SOURCE -include /tmp/vk_inc/vk_cfg.h $VK_INC $VK_COMMON src/loader/loader_linux.c $VK_GEN -ldl -lpthread -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS -DVK_USE_PLATFORM_METAL_EXT -DVK_USE_PLATFORM_MACOS_MVK -include /tmp/vk_inc/vk_cfg.h -I/tmp/vk_cf $VK_INC $VK_COMMON $VK_GEN -lm -Wl,-undefined,dynamic_lookup -o "dist/${LIB_OUT}-macos-arm64.dylib"
              ;;
          esac

          echo "=== Verifying produced binaries & runtime smoke tests ==="
          shopt -s nullglob
          for f in dist/*.dll dist/*.so dist/*.dylib dist/*.wasm dist/*.dll.a dist/*.exe dist/*-linux-x64 dist/*-linux-arm64 dist/*-macos-arm64; do
            test -s "$f" || { echo "ERROR: empty artifact $f"; exit 1; }
            file "$f"
          done

          if [ "$LIB_KEY" = "ninja" ] || [ "$LIB_KEY" = "limine" ]; then
            chmod +x "dist/${LIB_OUT}-linux-x64" "dist/${LIB_OUT}-linux-arm64" "dist/${LIB_OUT}-macos-arm64"
            "./dist/${LIB_OUT}-linux-x64" --version
          else
            cat > /tmp/dlprobe.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (argc < 2) return 2;
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) {
              fprintf(stderr, "dlopen(%s) failed: %s\n", argv[1], dlerror());
              return 1;
            }
            printf("dlopen(%s) OK\n", argv[1]);
            dlclose(h);
            return 0;
          }
          EOF
            zig cc -target x86_64-linux-gnu -O2 /tmp/dlprobe.c -ldl -o /tmp/dlprobe
            LD_LIBRARY_PATH="${DL_LD_LIBRARY_PATH}" /tmp/dlprobe "dist/${LIB_OUT}-linux-x64.so"
          fi

          if [ -f "dist/${LIB_OUT}-wasm32-wasi.wasm" ]; then
            node -e '
              const fs = require("node:fs");
              const p = process.argv[1];
              const buf = fs.readFileSync(p);
              if (buf.length < 8 || buf[0] !== 0x00 || buf[1] !== 0x61 || buf[2] !== 0x73 || buf[3] !== 0x6d) {
                console.error("Invalid WASM magic header in", p);
                process.exit(1);
              }
              if (!WebAssembly.validate(buf)) {
                console.error("WebAssembly.validate failed in", p);
                process.exit(1);
              }
              console.log("WebAssembly.validate OK:", p, buf.length, "bytes");
            ' "dist/${LIB_OUT}-wasm32-wasi.wasm"
          fi

          (cd dist && sha512sum * > "SHA512SUMS-${LIB_KEY}.txt")
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const distDir = "dist";
            const files = fs.readdirSync(distDir)
              .filter(f => /\.(dll|so|dylib|wasm|dll\.a|exe)$/.test(f) || /-(linux-x64|linux-arm64|macos-arm64)$/.test(f))
              .sort();
            const artifacts = files.map(name => {
              const buf = fs.readFileSync(path.join(distDir, name));
              return {
                name,
                size: buf.length,
                sha512: crypto.createHash("sha512").update(buf).digest("hex")
              };
            });
            const receipt = {
              schema: "holo-v11.shard-receipt.v1",
              pkg: process.env.LIB_KEY,
              libOut: process.env.LIB_OUT,
              repo: process.env.UP_REPO,
              tag: process.env.UP_TAG,
              version: process.env.UP_VER,
              deterministic: true,
              artifacts
            };
            fs.writeFileSync(
              path.join(distDir, `${process.env.LIB_OUT}-receipt.json`),
              JSON.stringify(receipt, null, 2) + "\n"
            );
          '
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        if: ${{ steps.build.outputs.skipped != 'true' }}
        with:
          name: tier4-sums-${{ matrix.lib }}
          path: dist/SHA512SUMS-${{ matrix.lib }}.txt

      - name: Upload Tier-4 5-OS Shard Binaries & Receipt to GitHub Release
        if: ${{ steps.build.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --repo awesome-os/upstream-mirrors --clobber

      - name: Attest SLSA Build Provenance for ${{ matrix.lib }} Shard & Receipt
        if: ${{ steps.build.outputs.skipped != 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

  finalize-tier4-sums:
    needs: [ensure-release, build-tier4-5os-shard]
    if: ${{ !cancelled() && needs.ensure-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Summarize Tier-4 Shards & Upload Tier-4 SHA512SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ensure-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = "/tmp/artifacts";
            const resolvedPath = path.join(root, "resolved-tier4-versions", "resolved-tier4-versions.json");
            const resolved = fs.existsSync(resolvedPath) ? JSON.parse(fs.readFileSync(resolvedPath, "utf8")).libraries : {};
            const expected = Object.keys(resolved);

            const sumLines = [];
            const rows = [];
            let passedCount = 0;

            for (const lib of expected) {
              const sumFile = path.join(root, `tier4-sums-${lib}`, `SHA512SUMS-${lib}.txt`);
              if (!fs.existsSync(sumFile)) {
                rows.push(`| \`${lib}\` | ${resolved[lib].tag} | FAILED | - |`);
                continue;
              }
              const lines = fs.readFileSync(sumFile, "utf8").trim().split(/\r?\n/).filter(Boolean);
              const targets = [];
              for (const line of lines) {
                const [sha, name] = line.trim().split(/\s+/);
                if (!sha || !name || name.endsWith(".txt") || name.endsWith(".json")) continue;
                sumLines.push(`${sha}  ${name}`);
                if (name.endsWith("-win64.dll") || name.endsWith("-win64.exe")) targets.push("win64");
                else if (name.endsWith("-linux-x64.so") || name.endsWith("-linux-x64")) targets.push("linux-x64");
                else if (name.endsWith("-linux-arm64.so") || name.endsWith("-linux-arm64")) targets.push("linux-arm64");
                else if (name.endsWith("-macos-arm64.dylib") || name.endsWith("-macos-arm64")) targets.push("macos-arm64");
                else if (name.endsWith("-wasm32-wasi.wasm")) targets.push("wasm32-wasi");
              }
              passedCount++;
              rows.push(`| \`${lib}\` | ${resolved[lib].tag} | PASS | ${targets.join(", ")} |`);
            }

            fs.writeFileSync("/tmp/SHA512SUMS-tier4.txt", sumLines.join("\n") + "\n");
            const summary = [
              `## Holo 5-OS Tier-4 Shards (${process.env.TAG})`,
              "",
              `- **Passed:** ${passedCount}/${expected.length}`,
              "",
              "| Library | Tag | Status | Targets |",
              "| :--- | :--- | :--- | :--- |",
              ...rows,
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          '
          if [ -s /tmp/SHA512SUMS-tier4.txt ]; then
            gh release upload "$TAG" /tmp/SHA512SUMS-tier4.txt --repo awesome-os/upstream-mirrors --clobber
          fi

      - name: Attest SLSA Build Provenance for Tier-4 Checksums
        if: ${{ hashFiles('/tmp/SHA512SUMS-tier4.txt') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '/tmp/SHA512SUMS-tier4.txt'
