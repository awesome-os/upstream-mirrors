name: Holo 5-OS Tier-4 Shards — Pure Zig 0.14.0 Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for 5-OS shared + WASI libraries'
        required: true
        default: 'v11-max-5os-latest'
      force_rebuild:
        description: 'Force rebuild of all shards even if receipt matches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holo-5os-tier4-shards.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      versions_json: ${{ steps.resolve.outputs.versions_json }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure GitHub Release & Resolve Tier-4 Upstream Versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v11-max-5os-latest' }}
        run: |
          gh release view "$TAG" --repo awesome-os/upstream-mirrors >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/upstream-mirrors \
              --title "Holo v11 Max 5-OS Shared + WASI Libraries (${TAG})" \
              --notes "Production max-version 5-OS shared libraries (Win64 .dll, Linux x64/ARM64 .so, macOS ARM64 .dylib, wasm32-wasi .wasm) compiled directly from upstream sources via pure holo-compiler (zig 0.14.0) — zero CMake, zero Ninja, zero Make."

          node -e '
            const fs = require("node:fs");
            const defaults = {
              liburing:              { pkg: "liburing",            libOut: "liburing",   repo: "axboe/liburing",                           tag: "liburing-2.15", version: "2.15" },
              ninja:                 { pkg: "ninja",               libOut: "ninja",      repo: "ninja-build/ninja",                        tag: "v1.13.2",       version: "1.13.2" },
              libavif:               { pkg: "libavif",             libOut: "libavif",    repo: "AOMediaCodec/libavif",                     tag: "v1.4.2",        version: "1.4.2" },
              cairo:                 { pkg: "cairo",               libOut: "libcairo",   repo: "gitlab.freedesktop.org/cairo/cairo",       tag: "1.18.4",        version: "1.18.4" },
              "mariadb-connector-c": { pkg: "mariadb-connector-c", libOut: "libmariadb", repo: "mariadb-corporation/mariadb-connector-c",  tag: "v3.4.11",       version: "3.4.11" },
              libgit2:               { pkg: "libgit2",             libOut: "libgit2",    repo: "libgit2/libgit2",                          tag: "v1.9.7",        version: "1.9.7" },
              curl:                  { pkg: "curl",                libOut: "libcurl",    repo: "curl/curl",                                tag: "curl-8_23_0",   version: "8.23.0" },
              openssl:               { pkg: "openssl",             libOut: "libssl",     repo: "openssl/openssl",                          tag: "openssl-4.1.0", version: "4.1.0" },
              limine:                { pkg: "limine",              libOut: "limine",     repo: "limine-bootloader/limine",                 tag: "v12.11.1",      version: "12.11.1" },
              "vulkan-loader":       { pkg: "vulkan-loader",       libOut: "libvulkan",  repo: "KhronosGroup/Vulkan-Loader",               tag: "v1.4.369",      version: "1.4.369" }
            };

            (async () => {
              const resolved = structuredClone(defaults);
              try {
                const res = await fetch("https://raw.githubusercontent.com/awesome-os/t2linux-baseline/main/catalog/live-upstream-tracker.json");
                if (res.ok) {
                  const tracker = await res.json();
                  const byPkg = new Map((tracker.libraries || []).map(x => [x.pkg, x]));
                  for (const cfg of Object.values(resolved)) {
                    const hit = byPkg.get(cfg.pkg);
                    if (hit && hit.upstreamTag) {
                      cfg.tag = hit.upstreamTag;
                      cfg.version = hit.upstreamVersion || hit.upstreamTag.replace(/^v/, "");
                      if (hit.repo && hit.repo.includes("/") && !hit.repo.includes("sourceforge.net")) {
                        cfg.repo = hit.repo;
                      }
                    }
                  }
                }
              } catch (err) {
                console.warn("[warn] tracker fetch failed, using safe defaults:", err.message);
              }

              const payload = {
                schema: "holo-v11.resolved-versions.v1",
                tier: "tier4",
                resolvedAt: new Date().toISOString(),
                releaseTag: process.env.TAG,
                libraries: resolved
              };
              fs.writeFileSync("resolved-tier4-versions.json", JSON.stringify(payload, null, 2) + "\n");
              const compact = JSON.stringify(resolved);
              const outFile = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(outFile, `release_tag=${process.env.TAG}\n`);
              fs.appendFileSync(outFile, `versions_json=${compact}\n`);
              console.log("Resolved 10 Tier-4 libraries:", JSON.stringify(resolved, null, 2));
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-tier4-versions
          path: resolved-tier4-versions.json

  build-tier4-5os-shard:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lib:
          - liburing
          - ninja
          - libavif
          - cairo
          - mariadb-connector-c
          - libgit2
          - curl
          - openssl
          - limine
          - vulkan-loader
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/holo-5os-tier4-shards.yml

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-${{ hashFiles('.github/workflows/holo-5os-tier4-shards.yml') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.14.0-${{ matrix.lib }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compile ${{ matrix.lib }} for 5 OS Targets via Pure Zig 0.14.0 + Smoke Test
        id: build
        env:
          LIB_KEY: ${{ matrix.lib }}
          VERSIONS_JSON: ${{ needs.ensure-release.outputs.versions_json }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const v = JSON.parse(process.env.VERSIONS_JSON)[process.env.LIB_KEY];
            console.log(`export UP_REPO=${JSON.stringify(v.repo)}`);
            console.log(`export UP_TAG=${JSON.stringify(v.tag)}`);
            console.log(`export UP_VER=${JSON.stringify(v.version)}`);
            console.log(`export LIB_OUT=${JSON.stringify(v.libOut)}`);
          ')"
          echo "lib_out=${LIB_OUT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_REBUILD}" != "true" ]; then
            mkdir -p /tmp/skip-check
            gh release view "$RELEASE_TAG" --repo awesome-os/upstream-mirrors --json assets > /tmp/skip-check/assets.json 2>/dev/null || echo '{"assets":[]}' > /tmp/skip-check/assets.json
            RECEIPT_NAME="${LIB_OUT}-receipt.json"
            if node -e '
              const fs = require("node:fs");
              const assets = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).assets || [];
              process.exit(assets.some(a => a.name === process.argv[2]) ? 0 : 1);
            ' /tmp/skip-check/assets.json "$RECEIPT_NAME"; then
              if gh release download "$RELEASE_TAG" --repo awesome-os/upstream-mirrors -p "$RECEIPT_NAME" -D /tmp/skip-check --clobber >/dev/null 2>&1; then
                if node -e '
                  const fs = require("node:fs");
                  const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const assets = new Set((JSON.parse(fs.readFileSync(process.argv[2], "utf8")).assets || []).map(a => a.name));
                  const upVer = process.argv[3];
                  const ok = receipt &&
                    receipt.version === upVer &&
                    Array.isArray(receipt.artifacts) &&
                    receipt.artifacts.length > 0 &&
                    receipt.artifacts.every(a => a && typeof a.name === "string" && assets.has(a.name));
                  process.exit(ok ? 0 : 1);
                ' "/tmp/skip-check/${RECEIPT_NAME}" /tmp/skip-check/assets.json "$UP_VER"; then
                  echo "skipped=true" >> "$GITHUB_OUTPUT"
                  echo "SKIP: ${LIB_KEY} ${UP_VER} already materialized"
                  exit 0
                fi
              fi
            fi
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          echo "=== Building ${LIB_KEY} (${LIB_OUT}) @ ${UP_REPO} ${UP_TAG} (${UP_VER}) ==="

          mkdir -p src dist
          DET_FLAGS="-ffile-prefix-map=$PWD=."
          DET_LINUX_FLAGS="-ffile-prefix-map=$PWD=. -Wl,--build-id=none"
          DL_LD_LIBRARY_PATH=""

          clone_tag() {
            local repo_url="https://github.com/${UP_REPO}.git"
            if [[ "$UP_REPO" == gitlab.* ]]; then
              repo_url="https://${UP_REPO}.git"
            fi
            git clone --depth=1 --branch "$UP_TAG" "$repo_url" src
          }

          case "$LIB_KEY" in
            liburing)
              clone_tag
              mkdir -p src/src/include/liburing /tmp/uring_inc
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^liburing-/, "").split("-")[0];
                const [maj = "2", min = "15"] = ver.split(".");
                fs.writeFileSync(
                  "src/src/include/liburing/io_uring_version.h",
                  `#ifndef LIBURING_VERSION_H\n#define LIBURING_VERSION_H\n#define IO_URING_VERSION_MAJOR ${maj}\n#define IO_URING_VERSION_MINOR ${min}\n#endif\n`
                );
              '
              cat > src/src/include/liburing/compat.h <<'EOF'
          #ifndef LIBURING_COMPAT_H
          #define LIBURING_COMPAT_H
          #include <stdint.h>
          #include <linux/time_types.h>
          #include <linux/openat2.h>
          #include <sys/stat.h>
          #ifndef BLOCK_URING_CMD_DISCARD
          #include <linux/ioctl.h>
          #define BLOCK_URING_CMD_DISCARD _IO(0x12, 0)
          #endif
          #endif
          EOF
              : > /tmp/uring_inc/config-host.h
              URING_SRCS="src/src/setup.c src/src/queue.c src/src/register.c src/src/syscall.c src/src/version.c"
              URING_FLAGS="-D_GNU_SOURCE -DLIBURING_INTERNAL -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -Isrc/src/include -include /tmp/uring_inc/config-host.h"
              zig cc -target x86_64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $URING_FLAGS $URING_SRCS -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu -O2 -shared -fPIC -s $DET_LINUX_FLAGS $URING_FLAGS $URING_SRCS -o "dist/${LIB_OUT}-linux-arm64.so"
              ;;

            ninja)
              clone_tag
              NINJA_POSIX_SRCS=$(find src/src -maxdepth 1 -name '*.cc' \
                ! -name '*.in.cc' ! -name '*_test.cc' ! -name '*_perftest.cc' ! -name '*_bench.cc' \
                ! -name 'browse.cc' ! -name 'test.cc' ! -name '*-win32.cc' | sort)
              NINJA_WIN_SRCS=$(find src/src -maxdepth 1 -name '*.cc' \
                ! -name '*.in.cc' ! -name '*_test.cc' ! -name '*_perftest.cc' ! -name '*_bench.cc' \
                ! -name 'browse.cc' ! -name 'test.cc' ! -name '*-posix.cc' | sort)
              mkdir -p /tmp/ninja_obj
              zig cc -target x86_64-windows-gnu -O2 -c $DET_FLAGS -Isrc/src src/src/getopt.c -o /tmp/ninja_obj/getopt.o
              zig c++ -target x86_64-windows-gnu -O2 -s -std=c++17 $DET_FLAGS -DNOMINMAX -Isrc/src $NINJA_WIN_SRCS /tmp/ninja_obj/getopt.o -o "dist/${LIB_OUT}-win64.exe"
              zig c++ -target x86_64-linux-gnu   -O2 -s -std=c++17 $DET_LINUX_FLAGS -idirafter src/src $NINJA_POSIX_SRCS -o "dist/${LIB_OUT}-linux-x64"
              zig c++ -target aarch64-linux-gnu  -O2 -s -std=c++17 $DET_LINUX_FLAGS -idirafter src/src $NINJA_POSIX_SRCS -o "dist/${LIB_OUT}-linux-arm64"
              zig c++ -target aarch64-macos      -O2 -std=c++17 $DET_FLAGS -idirafter src/src $NINJA_POSIX_SRCS -o "dist/${LIB_OUT}-macos-arm64"
              ;;

            libavif)
              clone_tag
              AVIF_CORE=$(find src/src -maxdepth 1 -name '*.c' ! -name 'codec_*.c' | sort)
              YUV_SRCS="src/third_party/libyuv/source/scale.c src/third_party/libyuv/source/scale_common.c src/third_party/libyuv/source/scale_any.c src/third_party/libyuv/source/row_common.c src/third_party/libyuv/source/planar_functions.c"
              AVIF_FLAGS="-Isrc/include -Isrc/third_party/libyuv/include"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -DAVIF_DLL -DAVIF_BUILDING_SHARED_LIBS $AVIF_FLAGS $AVIF_CORE $YUV_SRCS -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $AVIF_FLAGS $AVIF_CORE $YUV_SRCS -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $AVIF_FLAGS $AVIF_CORE $YUV_SRCS -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $AVIF_FLAGS $AVIF_CORE $YUV_SRCS -lm -o "dist/${LIB_OUT}-macos-arm64.dylib"
              zig cc -target wasm32-wasi        -O2 -mexec-model=reactor $DET_FLAGS $AVIF_FLAGS $AVIF_CORE $YUV_SRCS -lm -o "dist/${LIB_OUT}-wasm32-wasi.wasm"
              ;;

            cairo)
              if ! clone_tag; then
                rm -rf src && git clone --depth=1 --branch "1.18.4" "https://gitlab.freedesktop.org/cairo/cairo.git" src
              fi
              git clone --depth=1 --branch "pixman-0.46.4" "https://gitlab.freedesktop.org/pixman/pixman.git" /tmp/pixman_src
              mkdir -p /tmp/cairo_inc
              node -e '
                const fs = require("node:fs");
                let tpl = fs.readFileSync("/tmp/pixman_src/pixman/pixman-version.h.in", "utf8");
                tpl = tpl
                  .replaceAll("@PIXMAN_VERSION_MAJOR@", "0")
                  .replaceAll("@PIXMAN_VERSION_MINOR@", "46")
                  .replaceAll("@PIXMAN_VERSION_MICRO@", "4");
                fs.writeFileSync("/tmp/cairo_inc/pixman-version.h", tpl);
              '
              cat > /tmp/cairo_inc/pixman-config.h <<'EOF'
          #define PACKAGE "pixman"
          #define HAVE_PTHREADS 0
          EOF
              cat > /tmp/cairo_inc/cairo-features.h <<'EOF'
          #ifndef CAIRO_FEATURES_H
          #define CAIRO_FEATURES_H
          #define CAIRO_HAS_IMAGE_SURFACE 1
          #define CAIRO_HAS_RECORDING_SURFACE 1
          #define CAIRO_HAS_USER_FONT 1
          #define CAIRO_HAS_OBSERVER_SURFACE 1
          #endif
          EOF
              cat > /tmp/cairo_inc/config.h <<'EOF'
          #define PACKAGE "cairo"
          #define CAIRO_NO_MUTEX 1
          #define HAVE_STDINT_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_UINT64_T 1
          #ifndef _WIN32
          #define HAVE_UNISTD_H 1
          #endif
          EOF
              CAIRO_REL_SRCS="cairo-analysis-surface.c cairo-arc.c cairo-array.c cairo-atomic.c cairo-base64-stream.c cairo-base85-stream.c cairo-bentley-ottmann-rectangular.c cairo-bentley-ottmann-rectilinear.c cairo-bentley-ottmann.c cairo-botor-scan-converter.c cairo-boxes-intersect.c cairo-boxes.c cairo-cache.c cairo-clip-boxes.c cairo-clip-polygon.c cairo-clip-region.c cairo-clip-surface.c cairo-clip-tor-scan-converter.c cairo-clip.c cairo-color.c cairo-composite-rectangles.c cairo-compositor.c cairo-contour.c cairo-damage.c cairo-debug.c cairo-default-context.c cairo-device.c cairo-error.c cairo-fallback-compositor.c cairo-fixed.c cairo-font-face-twin-data.c cairo-font-face-twin.c cairo-font-face.c cairo-font-options.c cairo-freed-pool.c cairo-freelist.c cairo-gstate.c cairo-hash.c cairo-hull.c cairo-image-compositor.c cairo-image-info.c cairo-image-source.c cairo-image-surface.c cairo-line.c cairo-lzw.c cairo-mask-compositor.c cairo-matrix.c cairo-mempool.c cairo-mesh-pattern-rasterizer.c cairo-misc.c cairo-mono-scan-converter.c cairo-mutex.c cairo-no-compositor.c cairo-observer.c cairo-output-stream.c cairo-paginated-surface.c cairo-path-bounds.c cairo-path-fill.c cairo-path-fixed.c cairo-path-in-fill.c cairo-path-stroke-boxes.c cairo-path-stroke-polygon.c cairo-path-stroke-traps.c cairo-path-stroke-tristrip.c cairo-path-stroke.c cairo-path.c cairo-pattern.c cairo-pen.c cairo-polygon-intersect.c cairo-polygon-reduce.c cairo-polygon.c cairo-raster-source-pattern.c cairo-recording-surface.c cairo-rectangle.c cairo-rectangular-scan-converter.c cairo-region.c cairo-rtree.c cairo-scaled-font.c cairo-shape-mask-compositor.c cairo-slope.c cairo-spans-compositor.c cairo-spans.c cairo-spline.c cairo-stroke-dash.c cairo-stroke-style.c cairo-surface-clipper.c cairo-surface-fallback.c cairo-surface-observer.c cairo-surface-offset.c cairo-surface-snapshot.c cairo-surface-subsurface.c cairo-surface-wrapper.c cairo-surface.c cairo-time.c cairo-tor-scan-converter.c cairo-tor22-scan-converter.c cairo-toy-font-face.c cairo-traps-compositor.c cairo-traps.c cairo-tristrip.c cairo-unicode.c cairo-user-font.c cairo-version.c cairo-wideint.c cairo.c"
              PIX_REL_SRCS="pixman.c pixman-access.c pixman-access-accessors.c pixman-arm.c pixman-bits-image.c pixman-combine32.c pixman-combine-float.c pixman-conical-gradient.c pixman-edge.c pixman-edge-accessors.c pixman-fast-path.c pixman-filter.c pixman-glyph.c pixman-general.c pixman-gradient-walker.c pixman-image.c pixman-implementation.c pixman-linear-gradient.c pixman-matrix.c pixman-mips.c pixman-noop.c pixman-ppc.c pixman-radial-gradient.c pixman-region16.c pixman-region32.c pixman-region64f.c pixman-riscv.c pixman-solid-fill.c pixman-timer.c pixman-trap.c pixman-utils.c pixman-x86.c"
              CAIRO_SRCS=$(for f in $CAIRO_REL_SRCS; do echo "src/src/$f"; done)
              PIX_SRCS=$(for f in $PIX_REL_SRCS; do echo "/tmp/pixman_src/pixman/$f"; done)
              CAIRO_FLAGS="-DHAVE_CONFIG_H -DPIXMAN_NO_TLS -Wno-int-conversion -I/tmp/cairo_inc -Isrc/src -I/tmp/pixman_src/pixman"
              zig cc -target x86_64-windows-gnu -O2 -shared -s $DET_FLAGS -DCAIRO_WIN32_STATIC_BUILD -Wl,--export-all-symbols $CAIRO_FLAGS $CAIRO_SRCS $PIX_SRCS -lm -o "dist/${LIB_OUT}-win64.dll" "-Wl,--out-implib,dist/${LIB_OUT}-win64.dll.a"
              zig cc -target x86_64-linux-gnu   -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CAIRO_FLAGS $CAIRO_SRCS $PIX_SRCS -lm -o "dist/${LIB_OUT}-linux-x64.so"
              zig cc -target aarch64-linux-gnu  -O2 -shared -fPIC -s $DET_LINUX_FLAGS $CAIRO_FLAGS $CAIRO_SRCS $PIX_SRCS -lm -o "dist/${LIB_OUT}-linux-arm64.so"
              zig cc -target aarch64-macos      -O2 -shared -fPIC $DET_FLAGS $CAIRO_FLAGS $CAIRO_SRCS $PIX_SRCS -lm -o "dist/${LIB_OUT}-macos-arm64.dylib"
              ;;

            mariadb-connector-c)
              clone_tag
              git clone --depth=1 https://github.com/madler/zlib.git /tmp/zlib_src
              mkdir -p /tmp/mdb_posix /tmp/mdb_win /tmp/mdb_gen
              node -e '
                const fs = require("node:fs");
                const ver = process.env.UP_VER.replace(/^v/, "").split("-")[0];
                const [maj = "3", min = "4", pat = "11"] = ver.split(".");
                const pkgId = String(Number(maj) * 10000 + Number(min) * 100 + Number(pat));
                let tpl = fs.readFileSync("src/include/mariadb_version.h.in", "utf8");
                const reps = {
                  "@PROTOCOL_VERSION@": "10",
                  "@MARIADB_CLIENT_VERSION@": ver,
                  "@MARIADB_BASE_VERSION@": "mariadb-11.4",
                  "@MARIADB_VERSION_ID@": "110400",
                  "@MARIADB_PORT@": "3306",
                  "@MARIADB_UNIX_ADDR@": "/tmp/mysql.sock",
                  "@CPACK_PACKAGE_VERSION@": ver,
                  "@MARIADB_PACKAGE_VERSION_ID@": pkgId,
                  "@CMAKE_SYSTEM_NAME@": "Portable",
                  "@CMAKE_SYSTEM_PROCESSOR@": "generic",
                  "@CMAKE_INSTALL_PREFIX@/@INSTALL_PLUGINDIR@": "/usr/lib/mariadb/plugin",
                  "@default_charset@": "utf8mb4",
                  "@CC_SOURCE_REVISION@": process.env.UP_TAG
                };
                for (const [k, v] of Object.entries(reps)) tpl = tpl.replaceAll(k, v);
                fs.writeFileSync("/tmp/mdb_posix/mariadb_version.h", tpl);
                fs.writeFileSync("/tmp/mdb_win/mariadb_version.h", tpl);

                let plug = fs.readFileSync("src/libmariadb/ma_client_plugin.c.in", "utf8");
                plug = plug
                  .replaceAll("@PLUGINS_DISABLED@", "")
                  .replaceAll("@EXTERNAL_PLUGINS@", "extern struct st_mysql_client_plugin_pvio pvio_socket_client_plugin;\nextern struct st_mysql_client_plugin_authentication mysql_native_password_client_plugin;")
                  .replaceAll("@BUILTIN_PLUGINS@", "(struct st_mysql_client_plugin *)&pvio_socket_client_plugin,\n(struct st_mysql_client_plugin *)&mysql_native_password_client_plugin,");
                fs.writeFileSync("/tmp/mdb_gen/ma_client_plugin.c", plug);
              '
              cat > /tmp/mdb_posix/ma_config.h <<'EOF'
          #ifndef _ma_config_h_
          #define _ma_config_h_
          #define HAVE_ALLOCA_H 1
          #define HAVE_DLFCN_H 1
          #define HAVE_FCNTL_H 1
          #define HAVE_FLOAT_H 1
          #define HAVE_LIMITS_H 1
          #define HAVE_PWD_H 1
          #define HAVE_STDDEF_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STRING_H 1
          #define HAVE_SYS_IOCTL_H 1
          #define HAVE_SYS_SELECT_H 1
          #define HAVE_SYS_SOCKET_H 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_SYS_UN_H 1
          #define HAVE_UNISTD_H 1
          #define HAVE_DLERROR 1
          #define HAVE_DLOPEN 1
          #define HAVE_GETPWUID 1
          #define HAVE_MEMCPY 1
          #define HAVE_POLL 1
          #define HAVE_STRTOK_R 1
          #define HAVE_STRTOL 1
